const fract = x => x - Math.floor(x);
function draw(){
  ctx.clearRect(0,0,W,H);
  if (!run || (mode!=='play' && mode!=='over' && mode!=='ending')) { drawBgTitle(); return; }
  const vd = venueById(run.venue), z = run.zones[run.venue];
  const t = performance.now()/1000;
  const dp = clamp(1 - run.dayT/run.dayLen, 0, 1);
  drawVenue(vd, z, t, dp);
  updateAmbient(vd, dp);
  drawAmbient();
  const ents = [];
  for (const d of ROSTER) {
    if (d.venue!==run.venue) continue;
    const n = run.npcs[d.id];
    ents.push({ y:n.y, f:()=>drawNPC(d, n, t) });
  }
  if (run.mara) { const m = run.mara; ents.push({ y:m.y, f:()=>drawMara(m, t) }); }
  ents.sort((a,b)=>a.y-b.y);
  for (const e of ents) e.f();
  if (run.mara && run.mara.target) drawTether(t);
  drawParticles();
  duskOverlay(dp);
}
function drawBgTitle(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141028'); g.addColorStop(1,'#0b0a14');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const t = performance.now()/1000;
  for (let i=0;i<30;i++){
    const x = (i*97.3)%W, y = (i*173.7 + t*12*(1+(i%3)))%H;
    ctx.globalAlpha = 0.25+0.2*Math.sin(t+i);
    ctx.fillStyle = ['#ffd75e','#a86bff','#8effc1','#9ef3ff'][i%4];
    ctx.beginPath(); ctx.arc(x, H-y, 2.2, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function duskOverlay(dp){
  ctx.fillStyle = 'rgba(255,140,60,'+(0.10*Math.sin(Math.PI*dp)).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(4,2,12,'+(0.38*Math.pow(dp,1.5)).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
  const vg = ctx.createRadialGradient(W/2, H*0.44, Math.min(W,H)*0.42, W/2, H*0.44, Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,10,0.34)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
}
function stars(count, alpha, t){
  for (let i=0;i<count;i++){
    const x = fract(i*0.618034+0.13)*W, y = fract(i*0.381966+0.29)*H*0.5;
    const tw = 0.5+0.5*Math.sin(t*(1+(i%5)*0.4)+i);
    ctx.globalAlpha = alpha*(0.35+0.65*tw);
    ctx.fillStyle = i%7===0 ? '#cfe0ff' : '#fff';
    ctx.beginPath(); ctx.arc(x, y, i%9===0?1.6:1, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawVenue(vd, z, t, dp){
  // ----- sky -----
  let s0 = vd.sky[0], s1 = vd.sky[1];
  if (vd.id==='park') { // full day cycle: morning blue -> amber dusk
    const k = Math.pow(dp,1.3);
    s0 = blend('#2a5b9e','#33173f',k); s1 = blend('#7ab8d8','#d8703a',k);
  }
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,s0); g.addColorStop(1,s1);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars: night venues always, park as dusk deepens
  if (vd.night) stars(70, 0.8, t);
  else if (vd.outdoor && dp>0.6) stars(50, (dp-0.6)*2.2, t);

  // sun / moon
  if (vd.id==='park') {
    const sx = lerp(W*0.14, W*0.86, dp), sy = 120 - 55*Math.sin(Math.PI*dp) + 55;
    const sun = ctx.createRadialGradient(sx,sy,4,sx,sy,60);
    const warm = dp>0.6 ? '255,150,80' : '255,236,160';
    sun.addColorStop(0,'rgba('+warm+',.95)'); sun.addColorStop(0.25,'rgba('+warm+',.5)'); sun.addColorStop(1,'rgba('+warm+',0)');
    ctx.fillStyle = sun; ctx.beginPath(); ctx.arc(sx,sy,60,0,6.283); ctx.fill();
    // drifting clouds
    ctx.fillStyle = 'rgba(255,255,255,'+(0.22*(1-dp*0.7))+')';
    for (let i=0;i<3;i++){
      const cx = ((t*6+i*230)% (W+180))-90, cy = 70+i*34;
      ctx.beginPath();
      ctx.ellipse(cx,cy,44,12,0,0,6.283); ctx.ellipse(cx+28,cy+4,30,10,0,0,6.283); ctx.ellipse(cx-30,cy+5,26,9,0,0,6.283);
      ctx.fill();
    }
  }
  if (vd.night) {
    const mx = W*0.82, my = 84;
    const mg = ctx.createRadialGradient(mx,my,4,mx,my,52);
    mg.addColorStop(0,'rgba(230,235,255,.9)'); mg.addColorStop(0.3,'rgba(200,210,255,.35)'); mg.addColorStop(1,'rgba(200,210,255,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx,my,52,0,6.283); ctx.fill();
    ctx.fillStyle = '#e8ecfa'; ctx.beginPath(); ctx.arc(mx,my,15,0,6.283); ctx.fill();
    ctx.fillStyle = 'rgba(180,190,220,.5)';
    ctx.beginPath(); ctx.arc(mx-5,my-3,3.4,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+4,my+5,2.2,0,6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+6,my-6,1.6,0,6.283); ctx.fill();
  }

  // ----- distant scenery layer -----
  if (vd.id==='park') {
    ctx.fillStyle = 'rgba(20,60,40,.55)';
    ctx.beginPath(); ctx.moveTo(0, playTop()+40);
    for (let x=0;x<=W;x+=40) ctx.lineTo(x, playTop()+40-18*Math.sin(x*0.013+1)-8*Math.sin(x*0.05));
    ctx.lineTo(W, playTop()+70); ctx.lineTo(0, playTop()+70); ctx.closePath(); ctx.fill();
  } else if (vd.id==='rooftop' || vd.id==='office') {
    // city skyline with lit windows
    const base = vd.id==='rooftop' ? playTop()+58 : playTop()+52;
    for (let i=0;i<11;i++){
      const bw = 34+((i*37)%40), bx = i*(W/10)-10, bh = 40+((i*53)%70);
      ctx.fillStyle = vd.id==='rooftop' ? '#10142a' : '#1a2233';
      ctx.fillRect(bx, base-bh, bw, bh);
      ctx.fillStyle = 'rgba(255,220,130,.5)';
      for (let wy=0; wy<Math.floor(bh/14); wy++) for (let wx=0; wx<Math.floor(bw/12); wx++)
        if (((i*7+wy*3+wx*5)%9)<3) ctx.fillRect(bx+4+wx*12, base-bh+5+wy*14, 5, 6);
    }
  } else if (vd.id==='chapel') {
    // stained glass windows + light shafts
    const cols = [['#e86a8a','#8a4ae8'],['#ffd75e','#e8742c'],['#5ecfff','#3a6ae8']];
    for (let i=0;i<3;i++){
      const wx = W*(0.22+0.28*i), wy = playTop()-46, ww = 42, wh = 90;
      const wg = ctx.createLinearGradient(wx,wy,wx,wy+wh);
      wg.addColorStop(0,cols[i][0]); wg.addColorStop(1,cols[i][1]);
      ctx.globalAlpha = 0.8; ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.moveTo(wx-ww/2, wy+wh); ctx.lineTo(wx-ww/2, wy+18);
      ctx.arc(wx, wy+18, ww/2, Math.PI, 0);
      ctx.lineTo(wx+ww/2, wy+wh); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#0d0a20'; ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, wy+wh); ctx.moveTo(wx-ww/2, wy+40); ctx.lineTo(wx+ww/2, wy+40); ctx.stroke();
      // shaft
      ctx.globalAlpha = 0.10+0.03*Math.sin(t*0.7+i);
      ctx.fillStyle = cols[i][0];
      ctx.beginPath(); ctx.moveTo(wx-ww/2, wy+20); ctx.lineTo(wx+ww/2, wy+20);
      ctx.lineTo(wx+ww*1.5, playBot()+40); ctx.lineTo(wx-ww*1.5, playBot()+40); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ----- ground -----
  const gy = playBot()+140;
  const gr = ctx.createRadialGradient(W/2, gy, 40, W/2, gy, W*0.8);
  gr.addColorStop(0, blend(vd.ground, '#ffffff', 0.10));
  gr.addColorStop(0.55, vd.ground);
  gr.addColorStop(1, blend(vd.ground, '#000000', 0.5));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(W/2, gy, W*0.78, 230, 0, 0, 6.283); ctx.fill();

  // ----- venue set dressing -----
  ctx.save();
  if (vd.id==='park') {
    // pond
    ctx.globalAlpha = 0.75;
    const pg = ctx.createLinearGradient(0,playBot()-60,0,playBot()-10);
    pg.addColorStop(0,'#3a7ba8'); pg.addColorStop(1,'#274a68');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(W*0.82, playBot()-32, 70, 20, 0, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(W*0.82, playBot()-32, 46+4*Math.sin(t), 12, 0, 0, 6.283); ctx.stroke();
    // trees with layered canopies
    ctx.globalAlpha = 1;
    for (const [fx,fy,r] of [[0.10,0.16,30],[0.90,0.10,36],[0.46,0.06,26]]) {
      const tx = fx*W, ty = playTop()+fy*(playBot()-playTop());
      ctx.fillStyle='#3a2b1c'; ctx.fillRect(tx-4, ty+r-10, 8, 34);
      ctx.fillStyle='#1e3d24'; ctx.beginPath(); ctx.arc(tx, ty, r, 0, 6.283); ctx.fill();
      ctx.fillStyle='#2a5230'; ctx.beginPath(); ctx.arc(tx-r*0.4, ty-r*0.3, r*0.62, 0, 6.283); ctx.fill();
      ctx.fillStyle='#39683f'; ctx.beginPath(); ctx.arc(tx+r*0.35, ty-r*0.42, r*0.5, 0, 6.283); ctx.fill();
    }
    // grass tufts
    ctx.strokeStyle = 'rgba(120,190,110,.4)'; ctx.lineWidth = 1.4;
    for (let i=0;i<26;i++){
      const gx = fract(i*0.618+0.07)*W, gyy = playTop()+60+fract(i*0.318+0.61)*(playBot()-playTop()-60);
      ctx.beginPath(); ctx.moveTo(gx,gyy); ctx.lineTo(gx-2.5,gyy-6); ctx.moveTo(gx,gyy); ctx.lineTo(gx+2.5,gyy-5); ctx.stroke();
    }
  } else if (vd.id==='club') {
    // sweeping colored beams
    for (let i=0;i<4;i++){
      ctx.fillStyle = ['#ff2f9244','#2fdcff44','#c02fff44','#ffe32f44'][i];
      const bx = W*(0.2+0.2*i) + Math.sin(t*0.7+i)*40;
      ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx-52, playBot()); ctx.lineTo(bx+52, playBot()); ctx.closePath(); ctx.fill();
    }
    // disco ball
    const dbx = W/2, dby = 64;
    ctx.strokeStyle='#556'; ctx.beginPath(); ctx.moveTo(dbx,0); ctx.lineTo(dbx,dby-18); ctx.stroke();
    ctx.fillStyle='#c8d0e0'; ctx.beginPath(); ctx.arc(dbx,dby,18,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';
    for (let i=0;i<12;i++){ const a=t*1.6+i*0.524; ctx.fillRect(dbx+Math.cos(a)*14-1.5, dby+Math.sin(a)*14-1.5, 3, 3); }
    // speaker stacks
    for (const sxx of [W*0.06, W*0.86]) {
      ctx.fillStyle='#151222'; ctx.fillRect(sxx, playTop()+10, 44, 66);
      ctx.strokeStyle='#3a3357'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(sxx+22, playTop()+30, 12+1.5*Math.sin(t*9), 0, 6.283); ctx.stroke();
      ctx.beginPath(); ctx.arc(sxx+22, playTop()+58, 8+1.2*Math.sin(t*9+1), 0, 6.283); ctx.stroke();
    }
    // dance floor grid
    ctx.strokeStyle='rgba(160,120,255,.16)'; ctx.lineWidth=1;
    for (let i=0;i<7;i++){ const yy=playTop()+70+i*(playBot()-playTop()-70)/6;
      ctx.beginPath(); ctx.moveTo(W*0.06,yy); ctx.lineTo(W*0.94,yy); ctx.stroke(); }
    for (let i=0;i<9;i++){ const xx=W*(0.06+0.11*i);
      ctx.beginPath(); ctx.moveTo(xx,playTop()+70); ctx.lineTo(W/2+(xx-W/2)*1.5, playBot()); ctx.stroke(); }
  } else if (vd.id==='office') {
    // window wall glass
    ctx.fillStyle='rgba(90,120,170,.14)'; ctx.fillRect(0, 0, W, playTop()+58);
    ctx.strokeStyle='rgba(200,220,255,.18)'; ctx.lineWidth=2;
    for (let i=1;i<5;i++){ const xx=W*i/5; ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,playTop()+58); ctx.stroke(); }
    // fluorescent bars with flicker
    for (let i=0;i<4;i++){
      const fl = (Math.sin(t*13+i*7)>0.96) ? 0.35 : 0.8;
      ctx.fillStyle='rgba(230,240,255,'+fl+')';
      ctx.fillRect(W*(0.12+i*0.22), 66, W*0.13, 5);
    }
    // desks
    for (let i=0;i<3;i++){
      const dx2 = W*0.14 + i*W*0.30, dy2 = playTop()+34;
      ctx.fillStyle='#2c3448'; ctx.fillRect(dx2, dy2, W*0.18, 10);
      ctx.fillStyle='#232a3a'; ctx.fillRect(dx2+4, dy2+10, 6, 18); ctx.fillRect(dx2+W*0.18-10, dy2+10, 6, 18);
      ctx.fillStyle='#4a5a7a'; ctx.fillRect(dx2+W*0.05, dy2-12, 18, 12); // monitor
      ctx.fillStyle='#8fb0ff'; ctx.fillRect(dx2+W*0.05+2, dy2-10, 14, 8);
    }
  } else if (vd.id==='market') {
    // stall canopies
    for (let i=0;i<3;i++){
      const sx2 = W*(0.12+0.34*i), sw2 = W*0.24, sy2 = playTop()+12;
      ctx.fillStyle = i%2 ? '#7a2e3e' : '#2e5a7a';
      ctx.beginPath(); ctx.moveTo(sx2,sy2+22); ctx.lineTo(sx2+sw2/2,sy2); ctx.lineTo(sx2+sw2,sy2+22); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      for (let st=0; st<4; st++) ctx.fillRect(sx2+st*sw2/4, sy2+16, sw2/8, 8);
      ctx.fillStyle='#3a2b20'; ctx.fillRect(sx2+3, sy2+22, 4, 26); ctx.fillRect(sx2+sw2-7, sy2+22, 4, 26);
    }
    // lantern strings
    const cols = ['#ffb84e','#ff6b81','#7fe08e','#6bb8ff'];
    for (let row=0; row<2; row++) for (let i=0; i<7; i++) {
      const x = W*(0.08+0.14*i), y = playTop()+38+row*46 + Math.sin(i*1.3+row+t*0.6)*6;
      ctx.strokeStyle='rgba(255,255,255,.12)';
      if (i<6){ ctx.beginPath(); ctx.moveTo(x,y-8); ctx.quadraticCurveTo(x+W*0.07, y+6, W*(0.08+0.14*(i+1)), playTop()+30+row*46); ctx.stroke(); }
      const lg = ctx.createRadialGradient(x,y,1,x,y,16);
      lg.addColorStop(0,cols[(i+row)%4]); lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=0.5; ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(x,y,16,0,6.283); ctx.fill();
      ctx.globalAlpha=0.95; ctx.fillStyle=cols[(i+row)%4]; ctx.beginPath(); ctx.arc(x,y,5.5,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    }
    // cobbles
    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
    for (let i=0;i<18;i++){
      const cx2=fract(i*0.618+0.21)*W, cy2=playTop()+90+fract(i*0.381+0.5)*(playBot()-playTop()-80);
      ctx.beginPath(); ctx.ellipse(cx2,cy2,9,4,0,0,6.283); ctx.stroke();
    }
  } else if (vd.id==='chapel') {
    // candle rows
    for (let i=0;i<8;i++){
      const cx2 = W*(0.09+0.115*i), cy2 = playBot()-14;
      ctx.fillStyle='#d8cfa8'; ctx.fillRect(cx2-1.5, cy2-8, 3, 8);
      const fl = 0.7+0.3*Math.sin(t*11+i*2.4);
      const cg = ctx.createRadialGradient(cx2,cy2-11,0.5,cx2,cy2-11,9);
      cg.addColorStop(0,'rgba(255,210,110,'+(0.9*fl)+')'); cg.addColorStop(1,'rgba(255,160,60,0)');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx2,cy2-11,9,0,6.283); ctx.fill();
      ctx.fillStyle='rgba(255,236,170,'+fl+')'; ctx.beginPath(); ctx.ellipse(cx2,cy2-11,1.6,3,0,0,6.283); ctx.fill();
    }
    // pews (subtle)
    ctx.fillStyle='rgba(60,42,80,.5)';
    ctx.fillRect(W*0.05, playTop()+16, W*0.26, 8);
    ctx.fillRect(W*0.69, playTop()+16, W*0.26, 8);
    // checker tiles
    ctx.fillStyle='rgba(255,255,255,.035)';
    for (let ry=0; ry<5; ry++) for (let rx=0; rx<10; rx++)
      if ((rx+ry)%2===0) ctx.fillRect(W*0.05+rx*W*0.09, playTop()+92+ry*(playBot()-playTop()-92)/5, W*0.09, (playBot()-playTop()-92)/5);
  } else if (vd.id==='rooftop') {
    // roof edge + railing
    ctx.strokeStyle='rgba(180,190,220,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W*0.03, playTop()+64); ctx.lineTo(W*0.97, playTop()+64); ctx.stroke();
    for (let i=0;i<15;i++){ const xx=W*(0.03+0.067*i);
      ctx.beginPath(); ctx.moveTo(xx,playTop()+64); ctx.lineTo(xx,playTop()+82); ctx.stroke(); }
    // string lights across
    for (let i=0;i<10;i++){
      const x = W*(0.05+0.10*i), y = playTop()+96+Math.sin(i*1.1+t*0.5)*5;
      ctx.fillStyle=['#ffd75e','#ffb0c8','#b0e8ff'][i%3];
      ctx.globalAlpha=0.9; ctx.beginPath(); ctx.arc(x,y,3.6,0,6.283); ctx.fill();
      ctx.globalAlpha=0.25; ctx.beginPath(); ctx.arc(x,y,9,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    }
    // AC unit + antenna
    ctx.fillStyle='#252840'; ctx.fillRect(W*0.82, playTop()+120, 54, 30);
    ctx.strokeStyle='#3a3f5c'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(W*0.82+27, playTop()+135, 9, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.08, playTop()+118); ctx.lineTo(W*0.08, playTop()+70); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.08, playTop()+78); ctx.lineTo(W*0.11, playTop()+86); ctx.stroke();
  }
  ctx.restore();

  // ----- weather effects -----
  const wx = WX();
  if (wx.id==='drizzle') {
    ctx.strokeStyle = 'rgba(170,190,230,.28)'; ctx.lineWidth = 1;
    for (let i=0;i<44;i++){
      const rx = fract(i*0.618+0.11)*W;
      const ry = fract(i*0.318+t*(0.7+(i%3)*0.22))*H;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-2.5,ry+11); ctx.stroke();
    }
    ctx.fillStyle='rgba(30,40,60,.14)'; ctx.fillRect(0,0,W,H);
  } else if (wx.id==='golden') {
    for (let i=0;i<3;i++){
      ctx.fillStyle = 'rgba(255,220,130,'+(0.05+0.02*Math.sin(t*0.5+i*2))+')';
      const bx = W*(0.16+0.3*i)+Math.sin(t*0.13+i)*24;
      ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx+W*0.14,0); ctx.lineTo(bx+W*0.30, H); ctx.lineTo(bx+W*0.06, H); ctx.closePath(); ctx.fill();
    }
  } else if (wx.id==='static') {
    for (let i=0;i<14;i++){
      const sx2 = fract(i*0.618+fract(t*0.09))*W, sy2 = fract(i*0.318+0.4)*H*0.8;
      ctx.globalAlpha = Math.max(0, Math.sin(t*7+i*2.2))*0.5;
      ctx.fillStyle='#dfe8ff';
      ctx.fillRect(sx2, sy2, 1.6, 1.6);
    }
    ctx.globalAlpha=1;
  } else if (wx.id==='restless') {
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1.2;
    for (let i=0;i<6;i++){
      const wy2 = playTop()+30+i*(playBot()-playTop())/6;
      const off = fract(t*(0.25+(i%3)*0.1)+i*0.3)*W*1.4-W*0.2;
      ctx.beginPath();
      ctx.moveTo(off,wy2);
      ctx.quadraticCurveTo(off+40, wy2-6, off+80, wy2);
      ctx.quadraticCurveTo(off+110, wy2+5, off+130, wy2);
      ctx.stroke();
    }
  }

  // bloom-state tint
  if (z.bloomed==='bloom') { ctx.fillStyle='rgba(140,255,190,0.06)'; ctx.fillRect(0,0,W,H); }
  if (z.bloomed==='blight'){ ctx.fillStyle='rgba(90,30,140,0.14)'; ctx.fillRect(0,0,W,H); }
}

/* ---------------- ambient drifters ---------------- */
function updateAmbient(vd, dp){
  const dt = dtGlobal;
  if (ambientP.length < 40) {
    if (vd.id==='park') {
      if (dp>0.4 && Math.random()<dt*4) ambientP.push({ x:rnd(0,W), y:rnd(playTop(),playBot()), vx:rnd(-8,8), vy:rnd(-6,6), life:rnd(3,6), t:0, r:1.7, c:'#d8ffa0', fly:true });
      if (Math.random()<dt*1.2) ambientP.push({ x:rnd(0,W), y:-8, vx:rnd(-14,10), vy:rnd(14,26), life:rnd(5,8), t:0, r:2.3, c:'#ffc0d8', sway:true });
    } else if (vd.id==='market') {
      if (Math.random()<dt*3) ambientP.push({ x:rnd(W*0.1,W*0.9), y:playBot()-20, vx:rnd(-6,6), vy:rnd(-30,-16), life:rnd(1.5,3), t:0, r:1.6, c:'#ffb060', fly:true });
    } else if (vd.id==='chapel') {
      if (Math.random()<dt*2.5) ambientP.push({ x:rnd(W*0.15,W*0.85), y:rnd(80,playBot()), vx:rnd(-3,3), vy:rnd(2,7), life:rnd(4,8), t:0, r:1.3, c:'#e8dcff', mote:true });
    } else if (vd.id==='club') {
      if (Math.random()<dt*2) ambientP.push({ x:rnd(0,W), y:-6, vx:rnd(-10,10), vy:rnd(30,60), life:rnd(2,4), t:0, r:2, c:pick(['#ff6b90','#8effc1','#ffd75e','#6bb8ff']), sway:true });
    } else if (vd.id==='rooftop') {
      if (Math.random()<dt*1.2) ambientP.push({ x:-10, y:rnd(60,playTop()+40), vx:rnd(14,26), vy:rnd(-2,2), life:rnd(6,10), t:0, r:1.5, c:'#cfe0ff', fly:true });
    }
  }
  for (let i=ambientP.length-1;i>=0;i--){
    const p = ambientP[i]; p.t += dt;
    if (p.t>=p.life){ ambientP.splice(i,1); continue; }
    if (p.sway) p.x += Math.sin(p.t*2.4)*16*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
}
function drawAmbient(){
  const t = performance.now()/1000;
  for (const p of ambientP){
    const a = Math.min(1, Math.min(p.t, p.life-p.t)*2);
    ctx.globalAlpha = a * (p.fly ? 0.5+0.5*Math.sin(t*6+p.x) : 0.7);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- characters ---------------- */
const LOOKS = {};
function lookOf(id){
  if (LOOKS[id]) return LOOKS[id];
  let h = 0; const s = id+'aura';
  for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))>>>0;
  const skins = ['#f0d3b8','#e0b590','#c68e5a','#a9713f','#7c4a24','#f5e0cf'];
  const hairs = ['#2b2340','#4a2f1d','#7a4a21','#14141c','#8a8f9a','#b5651d','#d8b04a','#5a2b2b'];
  const l = { skin:skins[h%skins.length], hair:hairs[(h>>3)%hairs.length], hs:(h>>6)%4, blink:((h>>4)%97)/97*6.28, shade:((h>>8)%3) };
  LOOKS[id] = l; return l;
}
const GROUP_COLS = ['#4e79d4','#d46a4e','#57b06a','#b05aa8','#c2a13c','#5aa8b0','#8a6ad4','#b0685a','#6ab058','#a85a78','#5a78b0','#b09a5a','#7a5ab0','#b05a5a','#5ab093','#8f5ab0','#b0785a','#5a9ab0','#a0b05a','#b05a86'];
function drawNPC(d, n, t){
  const husked = n.state==='husk', rec = n.state==='recover';
  const depth = clamp((n.y-playTop())/(playBot()-playTop()), 0, 1);
  const sc = 0.78 + 0.5*depth;
  const bobY = husked ? 0 : Math.sin(t*1.7 + n.bob)*2.5;
  const l = lookOf(d.id);
  const gi = GROUPS.indexOf(d.group);
  let outfit = GROUP_COLS[gi % GROUP_COLS.length];
  if (l.shade===1) outfit = blend(outfit,'#000000',0.18);
  if (l.shade===2) outfit = blend(outfit,'#ffffff',0.15);

  ctx.save();
  ctx.translate(n.x, n.y + bobY);
  ctx.scale(sc, sc);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.ellipse(0, 27, 13, 4.2, 0, 0, 6.283); ctx.fill();

  // aura glow (emotion-colored)
  const emoKey = emotionOf(n.v, n.i);
  const emo = EMOTIONS[emoKey];
  if (!husked) {
    const pulse = 1 + 0.5*Math.sin(t * (2 + n.i*9));
    const rr = 26 + n.i*14 + pulse*2.5;
    const alpha = rec ? 0.10 : 0.15 + n.i*0.42;
    const grad = ctx.createRadialGradient(0, -2, 6, 0, -2, rr);
    grad.addColorStop(0, 'rgba('+emo.rgb+','+alpha+')');
    grad.addColorStop(1, 'rgba('+emo.rgb+',0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, -2, rr, 0, 6.283); ctx.fill();
    if (n.peak > 0) { // peak ring counts down
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.5+0.4*Math.sin(t*12))+')';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -2, rr+3, 0, 6.283*(n.peak/n.peakDur)); ctx.stroke();
      for (let sp=0; sp<3; sp++){ // orbiting sparkles
        const a2 = t*3 + sp*2.094;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(Math.cos(a2)*(rr+3), -2+Math.sin(a2)*(rr+3), 1.8, 0, 6.283); ctx.fill();
      }
    }
  }

  const walking = n.moving && !husked;
  const wp = t*9 + n.bob;
  const sw = walking ? Math.sin(wp)*4.5 : 0;

  // legs
  {
    ctx.strokeStyle = husked ? '#3f3c4a' : blend(outfit,'#000000',0.42);
    ctx.lineWidth = 4.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-4.5, 12); ctx.lineTo(-4.5 + sw, 24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4.5, 12); ctx.lineTo(4.5 - sw, 24); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  // torso
  ctx.fillStyle = husked ? '#4a4756' : outfit;
  ctx.beginPath(); ctx.ellipse(0, 4, 11.5, 13.5, 0, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(0, 9, 11.5, 8, 0, 0, Math.PI); ctx.fill();
  // arms
  ctx.strokeStyle = husked ? '#413e4e' : blend(outfit,'#000000',0.25);
  ctx.lineWidth = 3.6; ctx.lineCap = 'round';
  const asw = walking ? Math.sin(wp+Math.PI)*3.5 : 0;
  ctx.beginPath(); ctx.moveTo(-9.5, -2); ctx.lineTo(-11.5 + asw, 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9.5, -2); ctx.lineTo(11.5 - asw, 9); ctx.stroke();
  ctx.lineCap = 'butt';
  // head
  ctx.fillStyle = husked ? '#5c5968' : l.skin;
  ctx.beginPath(); ctx.arc(0, -12, 9.5, 0, 6.283); ctx.fill();
  // hair
  if (!husked) {
    ctx.fillStyle = l.hair;
    if (l.hs===0) { // short cap
      ctx.beginPath(); ctx.arc(0, -13.5, 9.5, Math.PI*1.05, Math.PI*1.95); ctx.closePath(); ctx.fill();
    } else if (l.hs===1) { // long
      ctx.beginPath(); ctx.arc(0, -13.5, 9.7, Math.PI*1.02, Math.PI*1.98); ctx.closePath(); ctx.fill();
      ctx.fillRect(-9.4, -14, 3.4, 12); ctx.fillRect(6.0, -14, 3.4, 12);
    } else if (l.hs===2) { // bun
      ctx.beginPath(); ctx.arc(0, -13.5, 9.5, Math.PI*1.05, Math.PI*1.95); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -23, 4, 0, 6.283); ctx.fill();
    } else { // spiky
      ctx.beginPath(); ctx.arc(0, -13.5, 9.3, Math.PI*1.05, Math.PI*1.95); ctx.closePath(); ctx.fill();
      for (let s2=-1; s2<=1; s2++){
        ctx.beginPath(); ctx.moveTo(s2*5-2.4, -20); ctx.lineTo(s2*5, -26.5); ctx.lineTo(s2*5+2.4, -20); ctx.closePath(); ctx.fill();
      }
    }
  } else {
    // cracks
    ctx.strokeStyle = '#3a3746'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(-3,-20); ctx.lineTo(-1.4,-16); ctx.lineTo(-3.4,-13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,-19); ctx.lineTo(3,-15.4); ctx.lineTo(5,-12.6); ctx.stroke();
  }
  // face
  const inkCol = husked ? '#39364a' : '#2b2340';
  const blinking = Math.sin(t*1.1 + l.blink) > 0.984;
  ctx.fillStyle = inkCol; ctx.strokeStyle = inkCol;
  if (blinking && !husked) {
    ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(-5.2,-13); ctx.lineTo(-2,-13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2,-13); ctx.lineTo(5.2,-13); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(-3.5, -13, husked?2.2:1.6, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(3.5, -13, husked?2.2:1.6, 0, 6.283); ctx.fill();
  }
  // brows tell the mood
  if (!husked) {
    ctx.lineWidth = 1.4;
    if (n.v < -0.25 && n.i > 0.5) { // anger: inner ends down
      ctx.beginPath(); ctx.moveTo(-5.6,-17.4); ctx.lineTo(-1.6,-15.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5.6,-17.4); ctx.lineTo(1.6,-15.6); ctx.stroke();
    } else if (n.v < -0.25) { // sadness: outer ends down
      ctx.beginPath(); ctx.moveTo(-5.6,-15.6); ctx.lineTo(-1.6,-17.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5.6,-15.6); ctx.lineTo(1.6,-17.2); ctx.stroke();
    } else if (n.v > 0.5) { // lifted
      ctx.beginPath(); ctx.moveTo(-5.4,-17.6); ctx.lineTo(-1.8,-17.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5.4,-17.6); ctx.lineTo(1.8,-17.9); ctx.stroke();
    }
  }
  // mouth
  if (!husked) {
    if (n.v > 0.5 && n.i > 0.7) { // open delight
      ctx.fillStyle = inkCol;
      ctx.beginPath(); ctx.ellipse(0, -7.4, 2.6, 3.1, 0, 0, 6.283); ctx.fill();
    } else {
      ctx.lineWidth = 1.4; ctx.beginPath();
      const m2 = n.v*3.5;
      ctx.moveTo(-4, -8); ctx.quadraticCurveTo(0, -8+m2, 4, -8); ctx.stroke();
    }
  } else { ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-3,-8); ctx.lineTo(3,-8); ctx.stroke(); }

  // charge ring
  if (!husked) {
    const cr = 20;
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.beginPath(); ctx.arc(0, -4, cr, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = n.peak>0 && Math.sin(t*14)>0 ? '#fff' : emo.c;
    ctx.beginPath(); ctx.arc(0, -4, cr, -1.5708, -1.5708 + 6.283*Math.min(1,n.i)); ctx.stroke();
    ctx.lineCap = 'butt';
    if (n.peak > 0 && n.state==='idle') {
      ctx.fillStyle = '#fff'; ctx.font = '900 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⚡', 0, -32 - 2.5*Math.sin(t*10));
    }
  }
  // selected marker
  if (selected===d.id) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(0, -2, 29, t%6.283, t%6.283+6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#fff'; ctx.font='700 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.name, 0, -44);
  }
  // readouts
  if (!husked) {
    if (run.upgrades.sight || hasTrait(d.id,'openbook')) {
      ctx.fillStyle = n.peak>0?'#fff':'#cfc6ee'; ctx.font='700 10px sans-serif'; ctx.textAlign='center';
      ctx.fillText(Math.round(n.i*100)+'%', 0, 34);
    }
    if (relic('prism') && n.i>0.45) {
      ctx.font='11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(emo.icon, 0, run.upgrades.sight||hasTrait(d.id,'openbook') ? 46 : 34);
    }
  }
  if (rec) { ctx.fillStyle='#8effc1'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('💤 '+Math.ceil(n.recoverT), 0, 34); }
  ctx.restore();
}

/* ---------------- Mara rendering ---------------- */
function drawMara(m, t){
  const depth = clamp((m.y-playTop())/(playBot()-playTop()), 0, 1);
  const sc = 0.82 + 0.5*depth;
  const hover = Math.sin(t*2.1)*3;
  ctx.save();
  ctx.translate(m.x, m.y + hover);
  ctx.scale(sc, sc);
  if (m.stunT>0) ctx.globalAlpha = 0.55;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(0, 30-hover*0.6, 15, 4.5, 0, 0, 6.283); ctx.fill();
  // smoky aura
  const ag = ctx.createRadialGradient(0,-4,4,0,-4,34);
  ag.addColorStop(0,'rgba(120,110,160,.30)'); ag.addColorStop(1,'rgba(120,110,160,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0,-4,34,0,6.283); ctx.fill();
  // cloak
  const cg = ctx.createLinearGradient(0,-28,0,26);
  cg.addColorStop(0,'#3d3a52'); cg.addColorStop(1,'#232030');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(0,-28);
  ctx.bezierCurveTo(-13,-24,-14,-6,-16,14);
  ctx.quadraticCurveTo(-12,10+Math.sin(t*3)*2,-8,18);
  ctx.quadraticCurveTo(-4,12,0,20);
  ctx.quadraticCurveTo(4,12,8,18);
  ctx.quadraticCurveTo(12,10+Math.cos(t*3)*2,16,14);
  ctx.bezierCurveTo(14,-6,13,-24,0,-28);
  ctx.fill();
  // hood opening
  ctx.fillStyle = '#0d0b16';
  ctx.beginPath(); ctx.ellipse(0,-15,7,8.4,0,0,6.283); ctx.fill();
  // ember eyes
  const gl = 0.6+0.4*Math.sin(t*5);
  ctx.fillStyle = 'rgba(255,141,92,'+gl+')';
  ctx.beginPath(); ctx.arc(-2.8,-15,1.5,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(2.8,-15,1.5,0,6.283); ctx.fill();
  ctx.globalAlpha = 1;
  if (m.stunT>0) { ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('💢', 0, -36); }
  else if (m.target) { ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#b9a9e8'; ctx.fillText('🩶 Mara', 0, -36); }
  ctx.restore();
  // ambient smoke
  if (Math.random()<dtGlobal*4) particles.push({ x:m.x+rnd(-8,8), y:m.y+rnd(0,16), vx:rnd(-6,6), vy:rnd(-18,-8), life:rnd(.6,1.2), t:0, color:'rgba(140,130,170,.5)', r:rnd(2,3.6) });
}
function drawTether(t){
  const m = run.mara, n = run.npcs[m.target];
  if (!n) return;
  const mx2 = (n.x+m.x)/2, my2 = Math.min(n.y,m.y)-30;
  ctx.strokeStyle = 'rgba(185,169,232,.6)';
  ctx.lineWidth = 1.6;
  ctx.setLineDash([5,6]); ctx.lineDashOffset = -t*26;
  ctx.beginPath(); ctx.moveTo(n.x, n.y-14);
  ctx.quadraticCurveTo(mx2, my2, m.x, m.y-12);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles(){
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i]; p.t += dtGlobal;
    if (p.t >= p.life) { particles.splice(i,1); continue; }
    const a = 1 - p.t/p.life;
    if (p.home) {
      const dx = 28-p.x, dy = 36-p.y, dist = Math.hypot(dx,dy)||1;
      if (dist < 26) { particles.splice(i,1); continue; }
      p.vx = p.vx*0.92 + (dx/dist)*640*dtGlobal;
      p.vy = p.vy*0.92 + (dy/dist)*640*dtGlobal;
      p.x += p.vx*dtGlobal; p.y += p.vy*dtGlobal;
      ctx.globalAlpha = 0.85; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*2.4, 0, 6.283); ctx.fill();
    } else if (p.wisp) {
      const k = p.t/p.life;
      p.x = p.sx + p.dx*k + Math.sin(k*9)*6;
      p.y = p.sy + p.dy*k;
      ctx.globalAlpha = a*0.8; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    } else if (p.txt) {
      p.x += p.vx*dtGlobal; p.y += p.vy*dtGlobal;
      ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.font = '800 16px sans-serif'; ctx.textAlign='center';
      ctx.fillText(p.txt, p.x, p.y);
    } else {
      p.x += p.vx*dtGlobal; p.y += p.vy*dtGlobal; p.vy += 40*dtGlobal;
      ctx.globalAlpha = a*0.9; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now(), dtGlobal = 0.016;
function frame(now){
  dtGlobal = clamp((now-last)/1000, 0.001, 0.05);
  last = now;
  update(dtGlobal);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', ()=>{ if (document.hidden) { saveRun(); saveMeta(); } });
window.addEventListener('pagehide', ()=>{ saveRun(); saveMeta(); });

titleScreen();
</script>
