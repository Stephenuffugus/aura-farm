<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aura Farm</title>
<style>
  :root {
    --gold:#ffd75e; --gold-deep:#e8a92c; --viol:#a86bff; --viol-deep:#6d35c9;
    --mint:#8effc1; --rose:#ff6b90; --ink:#0b0a14; --glass:rgba(20,16,40,.72);
    --glass-brt:rgba(34,27,66,.85); --line:rgba(255,255,255,.14); --txt:#efeaff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--txt); }
  #cv { position:fixed; inset:0; touch-action:none; }
  button { font-family:inherit; color:inherit; }

  @keyframes pulseGlow { 0%,100%{ box-shadow:0 0 10px 2px var(--gc,rgba(255,215,94,.4)); } 50%{ box-shadow:0 0 22px 7px var(--gc,rgba(255,215,94,.65)); } }
  @keyframes urgent { 0%,100%{ background:rgba(120,20,40,.9); transform:scale(1);} 50%{ background:rgba(220,40,70,.95); transform:scale(1.07);} }
  @keyframes popIn { 0%{ opacity:0; transform:scale(.6) translateY(14px);} 60%{ transform:scale(1.06);} 100%{ opacity:1; transform:scale(1) translateY(0);} }
  @keyframes bannerIn { 0%{ opacity:0; transform:translateY(-18px) scale(.9); letter-spacing:8px;} 20%{ opacity:1;} 80%{ opacity:1; transform:none; letter-spacing:2px;} 100%{ opacity:0; transform:translateY(-6px);} }
  @keyframes shake { 0%,100%{ transform:none;} 20%{ transform:translate(-5px,2px);} 40%{ transform:translate(4px,-3px);} 60%{ transform:translate(-3px,-2px);} 80%{ transform:translate(3px,2px);} }
  @keyframes flashFade { 0%{ opacity:.55; } 100%{ opacity:0; } }
  @keyframes shineSweep { 0%{ transform:translateX(-120%) skewX(-18deg);} 100%{ transform:translateX(240%) skewX(-18deg);} }
  @keyframes barPulse { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.5);} }
  @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  @keyframes hueShift { 0%,100%{ filter:hue-rotate(0deg);} 50%{ filter:hue-rotate(24deg);} }
  .shaking { animation:shake .35s ease-out; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:5;
    background:linear-gradient(180deg, rgba(8,6,18,.85), rgba(8,6,18,0)); }
  #hudRow1 { display:flex; align-items:center; gap:7px; }
  .chip { padding:4px 10px; border-radius:10px; background:var(--glass); border:1px solid var(--line); font-size:12.5px; font-weight:800; letter-spacing:.4px; white-space:nowrap; backdrop-filter:blur(6px); }
  #dayLbl { color:#cfc6ee; }
  #timeLbl { font-variant-numeric:tabular-nums; color:#fff; }
  #timeLbl.urgent { animation:urgent .8s infinite; border-color:#ff5c7a; }
  #essenceLbl { margin-left:auto; color:var(--gold); border-color:rgba(255,215,94,.35); text-shadow:0 0 12px rgba(255,215,94,.5); }
  #comboLbl { color:var(--mint); font-weight:900; font-size:13px; text-shadow:0 0 10px rgba(142,255,193,.6); animation:floaty 1s infinite; }
  #hudRow2 { display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:20px; border-radius:10px; background:rgba(255,255,255,.09); overflow:hidden; position:relative; border:1px solid var(--line); }
  #quotaFill { height:100%; width:0%; background:linear-gradient(90deg,#3fb2ff,var(--mint)); border-radius:10px; transition:width .35s, background .35s; position:relative; overflow:hidden; }
  #quotaFill.behind { background:linear-gradient(90deg,#ff9d3f,#ff5c7a); animation:barPulse 1.1s infinite; }
  #quotaFill.done { background:linear-gradient(90deg,var(--gold-deep),var(--gold)); }
  #quotaFill::after { content:''; position:absolute; top:0; bottom:0; width:36%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shineSweep 2.4s infinite; }
  #quotaTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; letter-spacing:.5px; text-shadow:0 1px 3px #000a; font-variant-numeric:tabular-nums; }
  #focusWrap { display:flex; align-items:center; gap:6px; width:120px; }
  #focusBar { flex:1; height:9px; border-radius:5px; background:rgba(255,255,255,.1); overflow:hidden; border:1px solid var(--line); }
  #focusFill { height:100%; width:100%; background:linear-gradient(90deg,#c99bff,#7fb4ff); border-radius:5px; }
  #focusLbl { font-size:9.5px; font-weight:800; letter-spacing:1px; opacity:.65; }
  #orb { width:28px; height:28px; border-radius:50%; flex:none; background:radial-gradient(circle at 35% 35%, #fff8, transparent 60%), var(--gold); animation:pulseGlow 2.2s infinite; }
  #hudRow3 { display:flex; align-items:center; gap:5px; flex-wrap:wrap; pointer-events:auto; }
  .cpill { padding:3px 9px; border-radius:9px; background:var(--glass); border:1px solid var(--line); font-size:10.5px; font-weight:800; letter-spacing:.3px; cursor:pointer; backdrop-filter:blur(5px); font-variant-numeric:tabular-nums; }
  .cpill.done { border-color:rgba(142,255,193,.65); color:var(--mint); text-shadow:0 0 8px rgba(142,255,193,.5); }
  .cpill.rare { border-color:rgba(158,243,255,.5); }

  #menuBtns { position:fixed; right:8px; top:calc(env(safe-area-inset-top,0px) + 92px); display:flex; flex-direction:column; gap:8px; z-index:6; }
  .mbtn { width:44px; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--glass); color:#fff; font-size:20px; cursor:pointer; backdrop-filter:blur(6px); box-shadow:0 3px 10px rgba(0,0,0,.35); position:relative; }
  .mbtn:active { transform:scale(.92); }
  .mbtn .dot { position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint); display:none; }
  #artBtns { position:fixed; left:8px; top:calc(env(safe-area-inset-top,0px) + 92px); display:flex; flex-direction:column; gap:8px; z-index:6; }
  .abtn { width:50px; height:50px; border-radius:15px; border:1px solid rgba(255,215,94,.35); background:var(--glass-brt); color:#fff; font-size:23px; cursor:pointer; position:relative; box-shadow:0 0 14px rgba(255,215,94,.22), 0 3px 10px rgba(0,0,0,.4); }
  .abtn:disabled { opacity:.4; box-shadow:none; }
  .abtn .cd { position:absolute; right:4px; bottom:2px; font-size:11px; font-weight:900; color:var(--gold); text-shadow:0 1px 2px #000; }

  /* ---------- overlays ---------- */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:8; opacity:0; transition:opacity .6s;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(160,20,50,.55) 100%); }
  #vignette.danger { opacity:1; animation:barPulse 1s infinite; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:9; opacity:0; }
  #flash.go { animation:flashFade .5s ease-out; }
  #banner { position:fixed; top:22%; left:0; right:0; text-align:center; z-index:16; pointer-events:none; display:none;
    font-size:30px; font-weight:900; letter-spacing:2px; text-shadow:0 0 24px rgba(255,215,94,.8), 0 3px 8px #000; }
  #banner.show { display:block; animation:bannerIn 1.7s ease-out forwards; }
  #banner .sub2 { display:block; font-size:13px; font-weight:700; letter-spacing:3px; opacity:.85; margin-top:4px; }
  #specCard { position:fixed; left:50%; top:34%; transform:translateX(-50%); z-index:17; pointer-events:none; display:none;
    background:var(--glass-brt); border:1.5px solid var(--sc,#c79bff); border-radius:18px; padding:14px 22px; text-align:center;
    box-shadow:0 0 30px var(--sc,#c79bff), 0 8px 30px rgba(0,0,0,.5); backdrop-filter:blur(8px); }
  #specCard.show { display:block; animation:popIn .4s cubic-bezier(.2,1.4,.4,1); }
  #specCard .ico { font-size:34px; display:block; }
  #specCard .tname { font-size:15px; font-weight:900; letter-spacing:2px; color:var(--sc,#c79bff); }
  #specCard .who { font-size:12.5px; opacity:.85; margin-top:2px; }

  /* ---------- NPC panel ---------- */
  #npcPanel { position:fixed; left:0; right:0; bottom:0; padding:34px 12px calc(env(safe-area-inset-bottom,0px) + 10px); z-index:5; display:none;
    background:linear-gradient(180deg, rgba(13,10,26,0), rgba(13,10,26,.94) 26%); }
  #npcHead { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  #npcName { font-weight:900; font-size:18px; letter-spacing:.3px; }
  #npcGroup { font-size:12px; opacity:.6; }
  #peakBadge { margin-left:auto; display:none; padding:4px 10px; border-radius:10px; font-size:12px; font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,#fff2c4,#ffd75e); color:#4a3400; animation:urgent .7s infinite; }
  #npcMood { font-size:13px; margin-bottom:7px; min-height:17px; color:#cfc6ee; line-height:1.45; }
  .meterRow { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .meterLabel { width:52px; font-size:9.5px; font-weight:900; letter-spacing:1.5px; opacity:.6; text-align:right; }
  .meter { flex:1; height:13px; border-radius:7px; position:relative; border:1px solid var(--line); overflow:hidden; }
  .meter.mood { background:linear-gradient(90deg, var(--viol-deep), #3a3357 48%, #3a3357 52%, var(--gold-deep)); }
  #moodMarker { position:absolute; top:-2px; bottom:-2px; width:5px; border-radius:3px; background:#fff; box-shadow:0 0 8px #fff; left:50%; transition:left .25s; }
  .meter.charge { background:rgba(255,255,255,.08); }
  #peakZone { position:absolute; top:0; bottom:0; left:75%; right:0; background:repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 5px, rgba(255,255,255,.05) 5px 10px); }
  #chargeFill { position:absolute; top:0; bottom:0; left:0; width:0%; background:linear-gradient(90deg,#6b5115,var(--gold)); transition:width .25s, background .4s; }
  #chargeFill.peaking { animation:barPulse .5s infinite; }
  #chargeTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:900; letter-spacing:1px; text-shadow:0 1px 2px #000; }
  #npcActions { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
  .act { padding:10px 12px; border-radius:13px; border:1px solid var(--line); font-size:13px; font-weight:800; color:#fff; background:#2a2347; cursor:pointer; position:relative; overflow:hidden; box-shadow:0 3px 8px rgba(0,0,0,.3); }
  .act:disabled { opacity:.35; box-shadow:none; }
  .act:active:not(:disabled) { transform:scale(.94); }
  .act.rad { background:linear-gradient(180deg,#95731f,#6b5115); border-color:rgba(255,215,94,.5); }
  .act.bli { background:linear-gradient(180deg,#53308a,#38205c); border-color:rgba(168,107,255,.5); }
  .act.harv { background:linear-gradient(180deg,#1f6b50,#154434); border-color:rgba(142,255,193,.55); }
  .act.harvB { background:linear-gradient(180deg,#6b1f47,#44152e); border-color:rgba(255,107,144,.55); }
  .act.ready { animation:pulseGlow 1s infinite; --gc:rgba(142,255,193,.5); }
  .act.harvB.ready { --gc:rgba(255,107,144,.5); }
  .cdveil { position:absolute; inset:0; background:rgba(0,0,0,.55); transform-origin:left; }
  .cost { font-size:10px; opacity:.75; font-weight:500; display:block; }

  /* ---------- modal ---------- */
  #modal { position:fixed; inset:0; background:rgba(5,4,12,.8); z-index:20; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px); }
  #modal.center { align-items:center; }
  #modalContent { background:linear-gradient(180deg,#1c1638,#151027); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:86vh; overflow-y:auto; padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px); box-shadow:0 -10px 40px rgba(0,0,0,.5); }
  #modal.center #modalContent { border-radius:20px; margin:12px; }
  h2 { font-size:20px; margin-bottom:4px; letter-spacing:.3px; }
  h3 { font-size:13px; margin:15px 0 7px; color:#bfb3e8; letter-spacing:1.2px; text-transform:uppercase; }
  .sub { font-size:13px; opacity:.72; margin-bottom:12px; line-height:1.45; }
  .big { display:block; width:100%; padding:14px; margin-top:10px; border-radius:14px; border:none; background:linear-gradient(180deg,#8a67ff,#5d40d6); color:#fff; font-size:15px; font-weight:900; letter-spacing:.4px; cursor:pointer; box-shadow:0 4px 16px rgba(124,92,255,.35); position:relative; overflow:hidden; }
  .big::after { content:''; position:absolute; top:0; bottom:0; width:30%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent); animation:shineSweep 3s infinite; }
  .big.ghost { background:transparent; border:1px solid rgba(255,255,255,.28); box-shadow:none; }
  .big.ghost::after { display:none; }
  .big:disabled { opacity:.4; }
  .shopItem { display:flex; align-items:center; gap:10px; padding:11px; border-radius:13px; background:rgba(255,255,255,.05); margin-bottom:8px; border:1px solid rgba(255,255,255,.06); }
  .shopItem .info { flex:1; }
  .shopItem .nm { font-weight:800; font-size:14px; }
  .shopItem .ds { font-size:12px; opacity:.7; line-height:1.35; }
  .buyBtn { padding:9px 13px; border-radius:11px; border:none; font-weight:900; font-size:13px; background:linear-gradient(180deg,#ffe28e,var(--gold-deep)); color:#3a2c00; cursor:pointer; white-space:nowrap; box-shadow:0 3px 10px rgba(255,215,94,.3); }
  .buyBtn:disabled { background:#443d5e; color:#999; box-shadow:none; }
  .owned { color:var(--mint); font-weight:800; font-size:13px; padding:8px 4px; }
  .caseGroup { margin-bottom:12px; }
  .caseRow { display:flex; gap:6px; flex-wrap:wrap; }
  .spec { width:64px; padding:7px 4px; border-radius:11px; background:rgba(255,255,255,.05); text-align:center; font-size:10px; }
  .spec .tier { font-size:16px; display:block; }
  .spec.empty { opacity:.32; }
  .setDone { color:var(--mint); font-size:11px; font-weight:800; }
  .venueCard { padding:13px; border-radius:14px; background:rgba(255,255,255,.06); margin-bottom:9px; border:1px solid transparent; cursor:pointer; }
  .venueCard.cur { border-color:#8a67ff; box-shadow:0 0 14px rgba(124,92,255,.25); }
  .venueCard.lock { opacity:.45; }
  .venueCard .nm { font-weight:900; font-size:15px; }
  .venueCard .ds { font-size:12px; opacity:.7; margin-top:2px; line-height:1.35; }
  .statline { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .tag { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:800; margin-left:6px; }
  .tag.bloom { background:#1d5c46; color:var(--mint); }
  .tag.blight { background:#4c2b7a; color:#d9b8ff; }
  .tag.turb { background:#5c4a1d; color:#ffe08e; }

  /* ---------- contracts / relics / records ---------- */
  .cItem { padding:11px 12px; border-radius:13px; background:rgba(255,255,255,.05); margin-bottom:8px; border:1px solid rgba(255,255,255,.07); }
  .cItem.done { border-color:rgba(142,255,193,.5); background:rgba(30,80,58,.22); }
  .cItem.hard { border-color:rgba(158,243,255,.35); }
  .cItem .ct { display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:800; }
  .cItem .ct .rw { margin-left:auto; font-size:12px; color:var(--gold); white-space:nowrap; }
  .cItem .cb { height:8px; border-radius:4px; background:rgba(255,255,255,.08); margin-top:7px; overflow:hidden; }
  .cItem .cbf { height:100%; border-radius:4px; background:linear-gradient(90deg,#3fb2ff,var(--mint)); transition:width .3s; }
  .cItem.done .cbf { background:linear-gradient(90deg,var(--gold-deep),var(--gold)); }
  .relicRow { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px; }
  .relicCard { width:100%; display:flex; gap:10px; align-items:center; padding:9px 11px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(158,243,255,.22); }
  .relicCard.lock { opacity:.35; border-color:rgba(255,255,255,.08); }
  .relicCard .ri { font-size:22px; }
  .relicCard .rn { font-weight:800; font-size:13.5px; }
  .relicCard .rd { font-size:11.5px; opacity:.7; line-height:1.3; }
  .mileRow { display:flex; gap:9px; align-items:center; padding:7px 4px; border-bottom:1px solid rgba(255,255,255,.06); font-size:12.5px; }
  .mileRow .mi { width:22px; text-align:center; }
  .mileRow.lock { opacity:.4; }
  .essRow { display:flex; align-items:center; gap:7px; margin:3px 0; font-size:11.5px; }
  .essRow .el { width:64px; opacity:.8; font-weight:700; }
  .essRow .eb { flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.07); overflow:hidden; }
  .essRow .ebf { height:100%; border-radius:4px; }
  .essRow .ev { width:48px; text-align:right; font-variant-numeric:tabular-nums; opacity:.85; }

  /* ---------- toasts ---------- */
  #toasts { position:fixed; top:calc(env(safe-area-inset-top,0px) + 98px); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:15; pointer-events:none; }
  .toast { background:var(--glass-brt); border:1px solid var(--line); padding:8px 15px; border-radius:13px; font-size:13px; font-weight:700; animation:popIn .3s ease-out; max-width:86vw; text-align:center; backdrop-filter:blur(6px); box-shadow:0 4px 14px rgba(0,0,0,.4); }

  .titleWrap { text-align:center; padding:12px 0 6px; }
  .titleWrap h1 { font-size:38px; letter-spacing:2px; background:linear-gradient(90deg,var(--gold),#ff9d6b,var(--viol)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:hueShift 6s infinite; }
  .titleWrap .tg { font-size:13px; opacity:.7; margin-top:5px; letter-spacing:1px; }
  .howto p { font-size:13.5px; line-height:1.55; margin-bottom:9px; color:#d8d0f0; }
  .gold { color:var(--gold); font-weight:800; } .viol { color:#c79bff; font-weight:800; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" style="display:none">
  <div id="hudRow1">
    <div id="orb"></div>
    <span class="chip" id="dayLbl">DAY 1</span>
    <span class="chip" id="timeLbl">2:00</span>
    <span id="comboLbl" style="display:none"></span>
    <span class="chip" id="essenceLbl">✦ 0</span>
  </div>
  <div id="hudRow2">
    <div class="bar"><div id="quotaFill"></div><span id="quotaTxt">QUOTA 0 / 90</span></div>
    <div id="focusWrap"><span id="focusLbl">FOCUS</span><div id="focusBar"><div id="focusFill"></div></div></div>
  </div>
  <div id="hudRow3"></div>
</div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="specCard"></div>

<div id="menuBtns" style="display:none">
  <button class="mbtn" onclick="openContracts()">📜<span class="dot" id="cDot"></span></button>
  <button class="mbtn" onclick="openShop()">🛍️</button>
  <button class="mbtn" onclick="openCase()">📦</button>
  <button class="mbtn" onclick="openMap()">🗺️</button>
  <button class="mbtn" id="sndBtn" onclick="toggleSound()">🔊</button>
  <button class="mbtn" onclick="openSettings()">⏸️</button>
</div>
<div id="artBtns" style="display:none"></div>

<div id="npcPanel">
  <div id="npcHead"><span id="npcName"></span><span id="npcGroup"></span><span id="peakBadge"></span></div>
  <div id="npcMood"></div>
  <div class="meterRow"><span class="meterLabel">MOOD</span><div class="meter mood"><div id="moodMarker"></div></div></div>
  <div class="meterRow"><span class="meterLabel">CHARGE</span><div class="meter charge"><div id="peakZone"></div><div id="chargeFill"></div><span id="chargeTxt"></span></div></div>
  <div id="npcActions"></div>
</div>

<div id="toasts"></div>
<div id="modal"><div id="modalContent"></div></div>

<script>
'use strict';
/* =========================================================
   AURA FARM v4 — harvest emotional energy. Radiance vs Blight.
   Six essences, Broker contracts, relics, Mara the Gray.
   ========================================================= */

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rnd = (a,b)=>a+Math.random()*(b-a);
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const $ = id=>document.getElementById(id);

/* ---------------- static data ---------------- */
const DAY_LEN = 120;
const LAST_DAY = 14;
const quotaFor = d => 90 + 55*(d-1);

const TIERS = [
  { min:0.92, name:'Transcendent', icon:'💎', color:'#9ef3ff' },
  { min:0.75, name:'Brilliant',    icon:'🌟', color:'#ffd75e' },
  { min:0.55, name:'Vivid',        icon:'✨', color:'#c79bff' },
  { min:0.35, name:'Common',       icon:'🔸', color:'#d8d0f0' },
  { min:0.00, name:'Faint',        icon:'·',  color:'#8a84a0' },
];
const tierOf = i => TIERS.find(t=>i>=t.min);

/* Six essences. What you harvest depends on where you steered the feeling. */
const EMOTIONS = {
  joy:   { n:'Joy',    icon:'☀️', c:'#ffd75e', rgb:'255,215,94'  },
  hope:  { n:'Hope',   icon:'🌿', c:'#8effc1', rgb:'142,255,193' },

    essBy:emoZero(), dayEss:emoZero(), dayDistinct:{}, dayPeakN:0,

    zones, unlocked,
    owned:{ hype:true, snide:true }, upgrades:{} };
}
function freshNpc(d){
  return { v:clamp(d.base + rnd(-0.15,0.15), -1, 1), i:rnd(0.03,0.12), state:'idle',
    recoverT:0, peak:0, peakDur:0, momentum:1, lastDir:0, eventT:rnd(4,18), festerT:0, seen:0,
    x:0, y:0, tx:0, ty:0, moveT:0, placed:false, bob:rnd(0,6.28), moving:false, face:1 };
}
function migrateRun(r){ // fill fields missing from older saves
  const fresh = { dayRad:0, dayBli:0, dayBest:null, combo:0, maxCombo:0, lastSign:0, history:[], qMet:false,
    weather:'clear', event:null, veilT:0, arts:{}, artCd:{},
    essBy:emoZero(), dayEss:emoZero(), dayDistinct:{}, dayPeakN:0,
    contracts:[], contractsDone:0, dayContractsDone:0, mara:null, stolen:0, dayStolen:0, dayLen:dayLenFor() };
  for (const k in fresh) if (r[k]===undefined) r[k] = fresh[k];
  for (const v of VENUES) {
    if (!r.zones[v.id]) r.zones[v.id] = { total:0, rad:0, bli:0, bloomed:null };
    if (r.unlocked[v.id]===undefined) r.unlocked[v.id] = false;
  }
  for (const d of ROSTER) {
    if (!r.npcs[d.id]) r.npcs[d.id] = freshNpc(d);
    const n = r.npcs[d.id];
    if (n.seen===undefined) n.seen = 0;
    if (n.moving===undefined) { n.moving = false; n.face = 1; }
  }
  if (!r.contracts.length) genContracts(r);
  return r;
}
function saveRun(){ try { if (run) localStorage.setItem('auraFarmRun', JSON.stringify(run)); else localStorage.removeItem('auraFarmRun'); } catch(e) {} }
function loadRun(){ try { const r = localStorage.getItem('auraFarmRun'); return r ? JSON.parse(r) : null; } catch(e) { return null; } }

/* ---------------- Broker contracts ---------------- */
function genContracts(r){
  r = r || run;
  const d = r.day;
  const mk = (o)=>Object.assign({ prog:0, done:false }, o);
  const easyPool = [
    ()=>{ const n = 3+Math.floor(d/4); return mk({ k:'rad', n, icon:'☀️', label:'Make '+n+' Radiance harvests', reward:50+12*d }); },
    ()=>{ const n = 4+Math.floor(d/3); return mk({ k:'distinct', n, icon:'👥', label:'Harvest '+n+' different souls', reward:50+12*d }); },
    ()=>{ const n = 2+Math.floor(d/4); return mk({ k:'peak', n, icon:'⚡', label:'Make '+n+' peak-window harvests', reward:55+13*d }); },
  ];
  const medPool = [
    ()=>{ const emo = pick(['joy','hope','sorrow','rage']); const amt = 50+16*d;
      return mk({ k:'ess', emo, amt, icon:EMOTIONS[emo].icon, label:'Deliver '+amt+'✦ of '+EMOTIONS[emo].n, reward:110+22*d }); },
    ()=>mk({ k:'combo', n:3, icon:'🔗', label:'Reach a ×3 peak combo', reward:110+22*d }),
    ()=>mk({ k:'tier', minI:0.75, n:1, icon:'🌟', label:'Capture a Brilliant harvest (≥75% charge)', reward:110+22*d }),
  ];
  const hardPool = [
    ()=>mk({ k:'tier', minI:0.92, n:1, icon:'💎', label:'Capture a Transcendent harvest (≥92% charge)', reward:220+45*d, hard:true }),
    ()=>{ const n = d>=6?5:4; return mk({ k:'combo', n, icon:'⛓️', label:'Reach a ×'+n+' peak combo', reward:220+45*d, hard:true }); },
  ];
  if (d>=3) hardPool.push(()=>{ const emo = pick(['awe','dread']); const amt = 30+9*d;
    return mk({ k:'ess', emo, amt, icon:EMOTIONS[emo].icon, label:'Deliver '+amt+'✦ of pure '+EMOTIONS[emo].n, reward:200+40*d, hard:true }); });
  if (d>=4) hardPool.push(()=>{ const n = 2+Math.floor(d/4);
    return mk({ k:'bli', n, icon:'🥀', label:'Make '+n+' Blight drains', reward:200+40*d, hard:true }); });
  const hard = pick(hardPool)();
  if (nextRelic()) hard.givesRelic = true;
  r.contracts = [ pick(easyPool)(), pick(medPool)(), hard ];
  r.dayContractsDone = 0;
}
function contractGoal(c){ return c.amt || c.n; }
function cprog(ev){
  if (!run || !run.contracts) return;
  let changed = false;
  for (const c of run.contracts) {
    if (c.done) continue;
    const before = c.prog;
    if (ev.type==='harvest') {
      if (c.k==='rad' && ev.sign>0) c.prog++;
      if (c.k==='bli' && ev.sign<0) c.prog++;
      if (c.k==='peak' && ev.onPeak) c.prog++;
      if (c.k==='distinct') c.prog = Object.keys(run.dayDistinct).length;
      if (c.k==='ess' && ev.emo===c.emo) c.prog += ev.amt;
      if (c.k==='tier' && ev.i>=c.minI) c.prog++;
    } else if (ev.type==='combo' && c.k==='combo') c.prog = Math.max(c.prog, ev.n);
    if (c.prog !== before) changed = true;
    if (c.prog >= contractGoal(c)) { completeContract(c); changed = true; }
  }
  if (changed) renderContractPills();
}
function completeContract(c){
  c.done = true; c.prog = contractGoal(c);
  const pay = c.reward * (relic('quill')?2:1);
  run.essence += pay; run.contractsDone++; run.dayContractsDone++;
  sfx.buy();
  toast('📜 Contract fulfilled: '+c.label+' — +'+pay+'✦');
  if (c.givesRelic) awardRelic();
  updateHud();
}
function awardRelic(){
  const r = nextRelic();
  if (!r) { run.essence += 300; toast('The Broker has no relics left to give. +300✦ instead.'); return; }
  meta.relics[r.id] = 1; saveMeta();
  banner('RELIC EARNED', '<span class="sub2">'+r.icon+' '+r.n.toUpperCase()+'</span>', '#9ef3ff');
  toast(r.icon+' '+r.n+': '+r.d+' (yours forever)');
  sfx.peak();
  if (!nextRelic()) mile('relics');
}

/* ---------------- daily setup ---------------- */
function rollDay(){
  run.weather = run.day===1 ? 'clear' : WEATHERS[Math.floor(Math.random()*WEATHERS.length)].id;
  run.event = null;
  const pool = VENUE_EVENTS.filter(e=>run.unlocked[e.venue]);
  if (run.day>1 && pool.length && Math.random()<0.6) {
    const ev = pool[Math.floor(Math.random()*pool.length)];
    run.event = { venue:ev.venue, group:ev.group, n:ev.n, d:ev.d };
    for (const m of groupMembers(ev.group)) { const n = run.npcs[m.id];
      if (n.state==='idle'){ n.v = clamp(n.v + ev.v, -1, 1); n.i = clamp(Math.max(n.i, Math.abs(ev.i)), 0, 1); } }
  }
  genContracts(run);
  renderContractPills();
}
function announceDay(){
  const w = WX();
  toast('☀️ Day '+run.day+' — quota ✦'+quotaFor(run.day));
  if (w.id!=='clear') toast(w.n+': '+w.d);

}

/* ---------------- audio ---------------- */
let AC = null, masterG = null;
function ac(){
  if (!AC) { try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterG = AC.createGain(); masterG.gain.value = meta.muted?0:1; masterG.connect(AC.destination);
  } catch(e) {} }
  return AC;
}
function beep(freq, dur, type, vol, when){
  const c = ac(); if (!c) return;
  const t = c.currentTime + (when||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(masterG); o.start(t); o.stop(t+dur+0.02);
}
/* quiet ambient pad per venue */
let padNodes = null;
const PAD_CHORDS = { park:[220,329.6], club:[146.8,220.0], office:[164.8,246.9], market:[196.0,293.7], chapel:[174.6,261.6], rooftop:[130.8,196.0] };
function startAmbient(venueId){
  const c = ac(); if (!c) return;
  stopAmbient();
  const freqs = PAD_CHORDS[venueId]||PAD_CHORDS.park;
  const g = c.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.016, c.currentTime+2);
  const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 700;
  g.connect(f); f.connect(masterG);
  const oscs = freqs.map((fr,i)=>{
    const o = c.createOscillator(); o.type = i? 'triangle':'sine';
    o.frequency.value = fr; o.detune.value = i?4:-3; o.connect(g); o.start(); return o;
  });
  padNodes = { g, f, oscs };
}
function stopAmbient(){
  if (!padNodes) return;
  try { const c = AC; padNodes.g.gain.linearRampToValueAtTime(0, c.currentTime+0.6);
    const p = padNodes; setTimeout(()=>p.oscs.forEach(o=>{ try{o.stop();}catch(e){} }), 800);
  } catch(e) {}
  padNodes = null;
}
const sfx = {

  harvB: ()=>{ beep(320,0.15,'sawtooth',0.09); beep(160,0.3,'sawtooth',0.08,0.1); },
  buy: ()=>{ beep(700,0.08,'square',0.05); beep(1050,0.12,'square',0.05,0.07); },
  fail: ()=>{ beep(300,0.3,'sawtooth',0.08); beep(200,0.5,'sawtooth',0.08,0.2); },
  day: ()=>{ beep(523,0.15,'sine',0.07); beep(659,0.15,'sine',0.07,0.12); beep(784,0.3,'sine',0.07,0.24); },
  heartbeat: ()=>{ beep(55,0.09,'sine',0.16); beep(50,0.12,'sine',0.14,0.16); },

function toggleSound(){ meta.muted = !meta.muted; if (masterG) masterG.gain.value = meta.muted?0:1; $('sndBtn').textContent = meta.muted?'🔇':'🔊'; saveMeta(); }

/* ---------------- canvas ---------------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const ow = W, oh = H;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (run && ow && oh) {
    for (const id in run.npcs) { const n = run.npcs[id];
      n.x *= W/ow; n.y *= H/oh; n.tx *= W/ow; n.ty *= H/oh; }
    if (run.mara) { run.mara.x *= W/ow; run.mara.y *= H/oh; run.mara.tx *= W/ow; run.mara.ty *= H/oh; }
  }
}
window.addEventListener('resize', resize); resize();
const playTop = ()=>120, playBot = ()=>H-190;

/* ---------------- game flow ---------------- */
let mode = 'title';        // title | play | over | ending
let modalOpen = false;
let selected = null;       // npc id
let particles = [];
let ambientP = [];         // set-dressing drifters: fireflies, petals, embers, motes
let cooldowns = {};        // actionId -> seconds left

function startGame(fresh){
  run = fresh ? newRun() : migrateRun(loadRun() || newRun());
  selected = null; cooldowns = {}; particles = []; ambientP = [];
  mode = 'play'; closeModal();
  $('hud').style.display = 'flex'; $('menuBtns').style.display = 'flex';
  $('sndBtn').textContent = meta.muted?'🔇':'🔊';
  placeNPCs(); startAmbient(run.venue); renderArts();
  if (fresh) { rollDay(); banner('DAY 1', '<span class="sub2">QUOTA ✦'+quotaFor(1)+' BEFORE DUSK</span>');
    toast('Tap someone to read their aura.');
    setTimeout(()=>{ if(mode==='play') toast('Fill their CHARGE into the striped peak zone, then harvest.'); }, 4000); }
  renderContractPills();
  updateHud();
}

function placeNPCs(){
  const groups = {}; let gi = 0;
  for (const g of GROUPS) groups[g] = ANCHORS[(gi++) % ANCHORS.length];
  for (const d of ROSTER) {
    const n = run.npcs[d.id];
    if (!(n.placed && n.x)) {
      const a = groups[d.group];
      n.x = a[0]*W + rnd(-70,70); n.y = playTop() + a[1]*(playBot()-playTop()) + rnd(-50,50);
      n.tx = n.x; n.ty = n.y; n.placed = true;
    }
    n.x = clamp(n.x, 40, W-64); n.y = clamp(n.y, playTop()+30, playBot()-10);
    n.tx = clamp(n.tx, 40, W-64); n.ty = clamp(n.ty, playTop()+30, playBot()-10);
  }
}
function groupAnchor(g){ const gi = GROUPS.indexOf(g); return ANCHORS[gi % ANCHORS.length]; }

/* ---------------- helpers ---------------- */
function karma(){ const t = run.rad + run.bli; return t<1 ? 0 : (run.rad - run.bli)/t; }
function setBonus(){
  let done = 0;
  for (const g of GROUPS) if (groupMembers(g).every(m=>meta.case[m.id])) done++;
  return 1 + done*0.05;
}
function setsDone(){ return GROUPS.filter(g=>groupMembers(g).every(m=>meta.case[m.id])).length; }
function yieldMult(sign, zone){
  let m = setBonus();
  if (run.upgrades.reson) m *= 1.15;
  const z = run.zones[zone];
  if (z.bloomed==='blight' && sign<0) m *= 1.25;
  if (z.bloomed==='turb') m *= 1.10;
  if (sign<0 && relic('thorn')) m *= 1.2;
  return m;
}
function repMod(dir){
  if (run.veilT > 0) return 1;
  const k = karma();
  if (k > 0.4) return dir>0 ? 1.1 : 0.75;
  if (k < -0.4) return dir<0 ? 1.1 : 0.75;
  return 1;
}
function trackSeen(id, amt){
  const n = run.npcs[id]; n.seen += amt;
  if (!meta.known[id] && n.seen >= 4 && (NPC_TRAITS[id]||[]).length) {
    meta.known[id] = 1; saveMeta();
    toast('🔍 You’ve read '+npcDef(id).name+': '+NPC_TRAITS[id].map(t=>TRAITS[t].n).join(' + '));
    if (Object.keys(meta.known).length >= 20) mile('reader');
    if (selected===id) renderPanel();
  }
}
function traitLine(id){
  const ts = NPC_TRAITS[id]||[];
  if (!ts.length) return '';
  return known(id) ? ts.map(t=>TRAITS[t].n+' — '+TRAITS[t].d).join(' · ') : '❔ unread (interact to learn them)';
}
function moodText(n){
  if (n.state==='husk') return 'Hollow. Nothing left to feel.';
  if (n.state==='recover') return 'Glowing softly, spent — recovering ('+Math.ceil(n.recoverT)+'s).';
  const v = n.v, i = n.i;
  let m;
  if (v > 0.5)      m = i>0.7?'Euphoric':i>0.4?'Delighted':'Content';
  else if (v > 0.15) m = i>0.7?'Excited':i>0.4?'Upbeat':'Pleasant';
  else if (v > -0.15)m = i>0.6?'Restless':'Neutral';
  else if (v > -0.5) m = i>0.7?'Seething':i>0.4?'Gloomy':'Irritable';
  else               m = i>0.7?'Despairing':i>0.4?'Miserable':'Down';
  if (n.peak<=0 && i>0.6) m += ' — aura swelling…';
  return m;
}
function updateMeters(n){
  $('moodMarker').style.left = ((clamp(n.v,-1,1)+1)/2*100)+'%';
  const cf = $('chargeFill');
  const emo = EMOTIONS[emotionOf(n.v, n.i)];
  cf.style.width = Math.round(n.i*100)+'%';
  cf.style.background = 'linear-gradient(90deg, rgba('+emo.rgb+',.35), '+emo.c+')';
  cf.classList.toggle('peaking', n.peak>0);
  $('chargeTxt').textContent = n.state==='husk' ? 'DRAINED' : emo.icon+' '+Math.round(n.i*100)+'%';
  const pb = $('peakBadge');
  if (n.peak>0 && n.state==='idle'){ pb.style.display='inline-block'; pb.textContent = '⚡ PEAK '+Math.ceil(n.peak)+'s'; }
  else pb.style.display='none';
}

/* ---------------- actions ---------------- */
function actUsable(actId, n){
  const a = ACTIONS[actId];
  const stateOk = a.special==='tend' ? n.state==='recover' : n.state==='idle';
  return stateOk && run.focus >= a.cost && (cooldowns[actId]||0) <= 0;
}
function doAction(actId){
  if (!run || mode!=='play' || modalOpen) return;
  const act = ACTIONS[actId]; const n = selected && run.npcs[selected];
  if (!act || !n || !actUsable(actId, n)) return;
  run.focus -= act.cost; cooldowns[actId] = act.cd;

  if (act.special==='tend') {
    n.recoverT *= 0.5; sfx.act(1); puff(n.x, n.y, '#8effc1', 8);
    return renderPanel();
  }
  if (act.special==='fester') {
    n.festerT = 20; sfx.act(-1); puff(n.x, n.y, '#a86bff', 8); return renderPanel();
  }

  const def = npcDef(selected);
  const targets = act.aoe ? groupMembers(def.group).map(m=>run.npcs[m.id]).filter(t=>t.state==='idle') : [n];
  for (const t of targets) pushEmotion(t, act, npcDef(ROSTER.find(r=>run.npcs[r.id]===t).id));
  sfx.act(act.dir);
  trackSeen(selected, 1);
  renderPanel();
}
function pushEmotion(n, act, def){
  let mod = repMod(act.dir);
  if (act.dir>0 && hasTrait(def.id,'sunny')) mod *= 1.5;
  if (act.dir<0 && hasTrait(def.id,'spirally')) mod *= 1.5;
  if (hasTrait(def.id,'guarded')) mod *= 0.7;
  n.v = clamp(n.v + act.dir*act.power*(1-Math.abs(n.v)*0.4)*mod, -1, 1);
  if (n.lastDir === act.dir) n.momentum = Math.min(2, n.momentum + 0.25);
  else { n.momentum = 1; n.i *= 0.85; }
  n.lastDir = act.dir;
  const cap = Math.min(1, (act.dir>0 ? 0.95 : 1.0) + (hasTrait(def.id,'bottled')?0.05:0));
  const volm = def.vol * venueById(def.venue).volMult * (run.zones[def.venue].bloomed==='turb'?1.5:1);
  n.i = clamp(n.i + act.gain*n.momentum*volm*mod, 0, cap);
  puff(n.x, n.y-20, act.dir>0?'#ffd75e':'#a86bff', 5);
}

function harvest(){
  if (!run || mode!=='play' || modalOpen) return;
  const n = selected && run.npcs[selected]; if (!n || n.state!=='idle') return;
  if (run.focus < 10) return;
  const def = npcDef(selected);
  const sign = n.v >= 0 ? 1 : -1;
  if (Math.abs(n.v) < 0.25) { toast('Their feeling is too faint to harvest. Push it further.'); return; }
  run.focus -= 10;
  trackSeen(selected, 2);

  const onPeak = n.peak > 0;
  if (onPeak) run.combo = (run.combo>0 && run.lastSign!==sign) ? 1 : run.combo+1;
  else run.combo = 0;
  run.lastSign = sign;
  run.maxCombo = Math.max(run.maxCombo, run.combo);
  if (run.combo >= 5) mile('combo5');
  const comboMult = 1 + Math.min(0.4, Math.max(0, run.combo-1)*0.08);

  const emo = emotionOf(n.v, n.i);
  const emoMult = EMOTIONS[emo].rare ? 1.35 : 1;
  let amt = Math.round(n.i * 100 * (sign<0 ? 1.6 : 1.0) * yieldMult(sign, def.venue) * comboMult * emoMult);
  if (hasTrait(def.id,'deepwell')) amt = Math.round(amt*1.2);
  run.essence += amt; run.dayEarned += amt; run.harvests++;
  run.essBy[emo] += amt; run.dayEss[emo] += amt;
  run.dayDistinct[def.id] = 1;
  if (onPeak) run.dayPeakN++;
  if (emo==='awe') mile('awe1');
  if (emo==='dread') mile('dread1');
  if (run.dayEarned >= 1000) mile('rich');
  if (sign>0) { run.rad += amt; run.dayRad += amt; } else { run.bli += amt; run.dayBli += amt; }
  if (!run.dayBest || n.i > run.dayBest.i) run.dayBest = { name:def.name, i:+n.i.toFixed(3), emo };
  if (run.combo>=2) floatText(n.x, n.y-56, 'COMBO ×'+run.combo, '#8effc1');
  const z = run.zones[def.venue]; z.total += amt; if (sign>0) z.rad += amt; else z.bli += amt;

  // Mara loses interest in a soul you just harvested
  if (run.mara && run.mara.target===def.id) { run.mara.target = null; run.mara.cd = 4; }

  // specimen
  const t = tierOf(n.i);
  const prev = meta.case[def.id];
  if (!prev || n.i > prev.i) {
    const setsBefore = setsDone();
    meta.case[def.id] = { i:+n.i.toFixed(3), tier:t.name, type:sign>0?'radiance':'blight', emo };
    saveMeta();
    showSpecCard(t, def, Math.round(n.i*100), !!prev);
    const kept = Object.keys(meta.case).length;
    if (kept >= 30) mile('case30');
    if (kept >= ROSTER.length) mile('caseall');
    if (setsDone() > setsBefore) { banner('SET COMPLETE','<span class="sub2">'+def.group.toUpperCase()+' — +5% ALL YIELDS, FOREVER</span>','#8effc1'); sfx.buy(); }
  }

  cprog({ type:'harvest', emo, amt, sign, onPeak, i:n.i });
  cprog({ type:'combo', n:run.combo });

  burst(n.x, n.y, EMOTIONS[emo].c, Math.round(10+n.i*22));
  essStream(n.x, n.y, EMOTIONS[emo].c, Math.round(6+n.i*10));
  floatText(n.x, n.y-34, '+'+amt+' '+EMOTIONS[emo].icon, EMOTIONS[emo].c);
  if (sign>0) { sfx.harvR(); flashFx('rgba('+EMOTIONS[emo].rgb+',.35)');
    n.state='recover'; n.recoverT = 28/def.res * (hasTrait(def.id,'resilient')?0.5:1) * (relic('locket')?0.75:1); n.i = 0; n.v *= 0.5; n.peak = 0; }
  else { sfx.harvB(); flashFx('rgba(110,30,170,.5)'); shakeFx();
    n.state='husk'; n.i = 0; n.peak = 0; toast(def.name+' goes quiet. They won’t feel again this run.'); }

  checkBloom(def.venue);
  renderPanel(); updateHud();
}

function checkBloom(vid){
  const z = run.zones[vid], vd = venueById(vid);
  if (z.bloomed || z.total < vd.bloomAt) return;
  const rr = z.rad / Math.max(1, z.total);
  z.bloomed = rr >= 0.6 ? 'bloom' : (rr <= 0.4 ? 'blight' : 'turb');
  const label = z.bloomed==='bloom' ? '🌸 BLOOMS WITH LIGHT' : z.bloomed==='blight' ? '🥀 CURDLES INTO BLIGHT' : '🌪 TURNS TURBULENT';
  banner(vd.name.toUpperCase(), '<span class="sub2">'+label+'</span>', z.bloomed==='bloom'?'#8effc1':z.bloomed==='blight'?'#d9b8ff':'#ffe08e');
  sfx.peak();
  const idx = VENUES.findIndex(v=>v.id===vid);
  if (idx+1 < VENUES.length && !run.unlocked[VENUES[idx+1].id]) {
    run.unlocked[VENUES[idx+1].id] = true;
    toast('🗺️ New venue unlocked: '+VENUES[idx+1].name);
  }
}

/* ---------------- Mara the Gray: the Broker's other harvester ---------------- */
function moveToward(o, tx, ty, step){
  const dx = tx-o.x, dy = ty-o.y, dist = Math.hypot(dx,dy);
  if (dist < 2) return true;
  o.x += dx/dist*Math.min(step,dist); o.y += dy/dist*Math.min(step,dist);
  return dist < 6;
}
function ensureMara(){
  if (run.day < 3) { run.mara = null; return; }
  if (!run.mara) run.mara = { x:W*0.92, y:playTop()+40, tx:W*0.5, ty:(playTop()+playBot())/2, stunT:0, target:null, siphonT:0, cd:3, wanderT:0 };
}
function updateMara(dt){
  ensureMara();
  const m = run.mara; if (!m) return;
  if (m.stunT > 0) {
    m.stunT -= dt; m.target = null;
    moveToward(m, W-70, playTop()+50, 70*dt);
    return;
  }
  if (m.cd > 0) m.cd -= dt;
  // validate target
  if (m.target) {
    const n = run.npcs[m.target], d = npcDef(m.target);
    if (!n || n.state!=='idle' || d.venue!==run.venue || n.i < 0.1) { m.target = null; m.siphonT = 0; }
  }
  // acquire: the juiciest idle aura you haven't claimed
  if (!m.target && m.cd <= 0) {
    let best = null, bi = 0.35;
    for (const d of ROSTER) {
      if (d.venue!==run.venue) continue;
      const n = run.npcs[d.id];
      if (n.state==='idle' && n.i > bi && d.id!==selected) { bi = n.i; best = d.id; }
    }
    m.target = best; m.siphonT = 0;
  }
  if (m.target) {
    const n = run.npcs[m.target];
    const dist = Math.hypot(n.x-m.x, n.y-m.y);
    if (dist > 48) moveToward(m, n.x+26, n.y-6, 44*dt);
    else {
      m.siphonT += dt;
      const rate = 0.055 * (relic('mirror')?0.6:1);
      const take = Math.min(Math.max(0, n.i-0.08), rate*dt);
      if (take > 0) {
        n.i -= take;
        run.stolen += take*100; run.dayStolen += take*100;
        if (Math.random() < dt*2.5) siphonWisp(n.x, n.y-14, m.x, m.y-10);
      }
      if (n.i <= 0.1) {
        if (Math.random()<0.5) toast('🩶 Mara drinks '+npcDef(m.target).name+'’s aura down to embers.');
        m.target = null; m.cd = 8; m.siphonT = 0;
      }
    }
  } else {
    // drift moodily around the venue
    m.wanderT -= dt;
    if (m.wanderT <= 0) { m.wanderT = rnd(3,6);
      m.tx = rnd(W*0.15, W*0.85); m.ty = rnd(playTop()+40, playBot()-20); }
    moveToward(m, m.tx, m.ty, 26*dt);
  }
}
function shooMara(){
  const m = run.mara; if (!m || m.stunT>0) return;
  if (run.focus < 15) { toast('Too drained to flare your aura (needs 15 focus).'); return; }
  run.focus -= 15;
  m.stunT = 12; m.target = null; m.siphonT = 0;
  meta.maraShoos = (meta.maraShoos||0)+1; saveMeta();
  if (meta.maraShoos >= 5) mile('shoo5');
  sfx.shoo(); burst(m.x, m.y, '#cfd2ff', 14);
  toast('You flare your aura. Mara hisses and backs off — 12s.');
}

/* ---------------- simulation ---------------- */
function update(dt){
  if (mode!=='play' || modalOpen) return;
  run.focus = clamp(run.focus + 6*(relic('lantern')?1.25:1)*dt, 0, focusCap());
  for (const k in cooldowns) cooldowns[k] = Math.max(0, cooldowns[k]-dt);
  run.veilT = Math.max(0, run.veilT - dt);
  for (const k in run.artCd) run.artCd[k] = Math.max(0, run.artCd[k]-dt);
  artsT -= dt; if (artsT<=0){ artsT = 0.3; updateArtBtns(); }

  // dusk dread: heartbeat when the quota is short and the light is dying
  tensionT -= dt;
  if (tensionT<=0){ tensionT = 1;
    if (run.dayEarned < quotaFor(run.day) && run.dayT < 15) sfx.heartbeat(); }
  // peak window closing on the selected soul: audible ticking
  if (selected){ const sn = run.npcs[selected];
    if (sn && sn.peak>0 && sn.peak<3){ tickT -= dt; if (tickT<=0){ tickT = 0.5; sfx.tick(); } } }

  run.dayT -= dt;
  if (run.dayT <= 0) return endDay();

  updateMara(dt);

  const cur = run.venue;
  const vdCur = venueById(cur);
  const huskList = [];
  for (const d of ROSTER) { const n = run.npcs[d.id];
    if (n.state==='husk' && d.venue===cur) huskList.push({ x:n.x, y:n.y, r:hasTrait(d.id,'fragile')?220:110 }); }

  const dp = 1 - run.dayT/run.dayLen;
  for (const d of ROSTER) {
    const n = run.npcs[d.id];
    const inCur = d.venue === cur;
    if (n.state==='recover') {
      n.recoverT -= dt * (inCur?1:0.6);
      n.v += (d.base+0.2 - n.v)*0.03*dt;
      if (n.recoverT <= 0) { n.state='idle'; n.i = 0.05; n.momentum = 1; }
      continue;
    }
    if (n.state==='husk') { if (inCur) wander(n, d, dt, 0.35); continue; }
    if (!inCur) { n.v += (d.base - n.v)*0.01*dt; n.i = Math.max(0.05, n.i - 0.004*dt); continue; }

    const vd = vdCur, z = run.zones[d.venue];
    // drift toward baseline + ambiance + daily weather
    // the market's mood swings like a pendulum; the chapel starts in wedding light and sinks toward the wake
    const driftMult = n.festerT>0 ? 0.25 : 1;
    let amb = vd.ambient;
    if (vd.id==='market') amb += 0.15*Math.sin((run.dayLen-run.dayT)/12);
    if (vd.id==='chapel') amb += 0.30*Math.cos(Math.PI*dp);
    let target = d.base + amb + (WX().drift||0) + (z.bloomed==='bloom'?0.12:0) + (z.bloomed==='blight'?-0.12:0);
    n.v += (clamp(target,-1,1) - n.v)*0.018*dt*driftMult;
    if (n.festerT>0) n.festerT -= dt;

    // life events: spontaneous emotional weather — observation matters
    n.eventT -= dt * d.vol * vd.volMult * (WX().events||1) * (hasTrait(d.id,'volatile')?2:1);
    if (n.eventT <= 0) {
      n.eventT = rnd(9, 26);
      n.v = clamp(n.v + rnd(-0.5,0.5)*d.vol, -1, 1);
      n.i = clamp(n.i + rnd(0.08,0.3)*d.vol, 0, 1);
      puff(n.x, n.y-18, n.v>=0?'#ffe9a8':'#d0b0ff', 3);
    }

    // group contagion (Loners are immune; Empaths catch it double)
    if (!hasTrait(d.id,'loner')) {
      let gs = 0, gc = 0;
      for (const m of groupMembers(d.group)) { if (m.id===d.id) continue;
        const o = run.npcs[m.id]; if (o.state!=='idle') continue;
        gs += o.v; gc++; }
      if (gc) n.v += (gs/gc - n.v) * 0.03 * dt * (z.bloomed==='blight'?2:1) * (hasTrait(d.id,'empath')?2:1);
    }

    // husk gloom (paused while the Umbral Veil holds)
    if (run.veilT<=0) for (const h of huskList) { const dx=h.x-n.x, dy=h.y-n.y;
      if (dx*dx+dy*dy < h.r*h.r) n.v = clamp(n.v - 0.012*dt, -1, 1); }

    // intensity decay
    if (n.peak <= 0) n.i = Math.max(0.04, n.i - 0.008*dt*(WX().decay||1)*(hasTrait(d.id,'steady')?0.5:1));

    // ripening: peak windows
    if (n.peak > 0) {
      n.peak -= dt;
      const cap = Math.min(1, (n.v>=0 ? 0.95 : 1.0) + (hasTrait(d.id,'bottled')?0.05:0));
      n.i = clamp(n.i + 0.02*dt*d.vol, 0, cap);
      if (n.peak <= 0) { // missed it — the feeling vents
        n.i = 0.18; if (n.v < 0) n.v *= 0.4;
        puff(n.x, n.y-20, '#888', 6);
        if (selected===d.id) renderPanel();
      }
    } else if (n.i >= 0.75) {
      n.peakDur = Math.max(2.5, ((n.v>=0 ? 12 : 5) - (hasTrait(d.id,'bottled')?1.5:0)) * (run.upgrades.patient?1.5:1) * (relic('bell')?1.2:1));
      n.peak = n.peakDur;
      sfx.peak(); puff(n.x, n.y-26, '#fff', 10);
      if (selected===d.id) renderPanel();
    }

    wander(n, d, dt, 1);
  }

  // keep people from standing inside each other
  const curNpcs = ROSTER.filter(d=>d.venue===cur).map(d=>run.npcs[d.id]);
  for (let a=0; a<curNpcs.length; a++) for (let b=a+1; b<curNpcs.length; b++) {
    const A = curNpcs[a], B = curNpcs[b];
    const dx = B.x-A.x, dy = B.y-A.y, dist = Math.hypot(dx,dy) || 0.01;
    if (dist < 42) {
      const push = (42-dist) * 0.5 * Math.min(1, dt*6);
      const ux = dx/dist, uy = dy/dist;
      A.x = clamp(A.x - ux*push, 36, W-64); A.y = clamp(A.y - uy*push, playTop()+28, playBot()-8);
      B.x = clamp(B.x + ux*push, 36, W-64); B.y = clamp(B.y + uy*push, playTop()+28, playBot()-8);
    }
  }

  // occasional panel refresh so mood text stays honest
  panelT -= dt; if (panelT<=0){ panelT = 0.5; if (selected) renderPanel(true); }
  updateHud();
}
let panelT = 0, tensionT = 0, tickT = 0;

function wander(n, d, dt, speedMult){
  n.moveT -= dt;
  if (n.moveT <= 0) {
    n.moveT = rnd(2.5, 7);
    const a = groupAnchor(d.group);
    const ax = a[0]*W, ay = playTop() + a[1]*(playBot()-playTop());
    n.tx = clamp(ax + rnd(-85,85), 36, W-64);
    n.ty = clamp(ay + rnd(-65,65), playTop()+28, playBot()-8);
  }
  const dx = n.tx-n.x, dy = n.ty-n.y, dist = Math.hypot(dx,dy);
  if (dist > 2) {
    const sp = 16*speedMult; n.x += dx/dist*sp*dt; n.y += dy/dist*sp*dt;
    n.moving = true; if (Math.abs(dx) > 0.5) n.face = dx>0?1:-1;
  } else n.moving = false;
}

/* ---------------- day / run flow ---------------- */
function essBars(src){
  let html = '';
  const max = Math.max(1, ...EMO_KEYS.map(k=>src[k]||0));
  for (const k of EMO_KEYS) {
    const v = src[k]||0; if (!v) continue;
    const e = EMOTIONS[k];
    html += '<div class="essRow"><span class="el">'+e.icon+' '+e.n+'</span><div class="eb"><div class="ebf" style="width:'+Math.round(100*v/max)+'%;background:'+e.c+'"></div></div><span class="ev">✦'+v+'</span></div>';
  }
  return html || '<div class="sub">Nothing harvested.</div>';
}
function endDay(){
  const met = run.dayEarned >= quotaFor(run.day);
  if (!met) { sfx.fail(); return gameOver(); }
  sfx.day();
  run.history.push({ d:run.day, rad:run.dayRad, bli:run.dayBli });
  if (run.day >= LAST_DAY) return ending();
  const husks = ROSTER.filter(d=>run.npcs[d.id].state==='husk').length;
  showModal(`
    <h2>Dusk falls on Day ${run.day}</h2>
    <div class="sub">Quota met. The farm endures.</div>

    <div class="statline"><span>Quota</span><b>✦ ${quotaFor(run.day)}</b></div>
    <div class="statline"><span>Contracts fulfilled</span><b>${run.dayContractsDone} / 3</b></div>
    ${run.dayBest?`<div class="statline"><span>Finest capture</span><b>${run.dayBest.name} · ${Math.round(run.dayBest.i*100)}% ${run.dayBest.emo?EMOTIONS[run.dayBest.emo].icon:''}</b></div>`:''}
    ${run.dayStolen>=1?`<div class="statline"><span>Siphoned away by Mara</span><b style="color:#9aa">✦ ${Math.round(run.dayStolen)}</b></div>`:''}
    <div class="statline"><span>Husks left behind</span><b>${husks}</b></div>
    <div class="statline"><span>Tomorrow’s quota</span><b>✦ ${quotaFor(run.day+1)}</b></div>
    <div class="statline"><span>Balance</span><b style="color:#ffd75e">✦ ${run.essence}</b></div>
    <h3>Today’s essences</h3>${essBars(run.dayEss)}

function nextDay(){
  run.day++; run.dayLen = dayLenFor(); run.dayT = run.dayLen; run.dayEarned = 0; run.focus = focusCap();
  run.dayRad = 0; run.dayBli = 0; run.dayBest = null; run.combo = 0; run.qMet = false;
  run.dayEss = emoZero(); run.dayDistinct = {}; run.dayPeakN = 0; run.dayStolen = 0;

const EMO_EPITHETS = {

    <h3>Run essences</h3>${essBars(run.essBy)}

/* ---------------- UI: hud, panel, toasts, particles ---------------- */
function updateHud(){
  if (!run) return;
  $('dayLbl').textContent = 'DAY '+run.day;
  const s = Math.max(0, Math.ceil(run.dayT));
  const tl = $('timeLbl');
  tl.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('essenceLbl').textContent = '✦ '+run.essence;
  const q = quotaFor(run.day);
  const met = run.dayEarned >= q;
  tl.classList.toggle('urgent', !met && run.dayT < 20 && mode==='play');
  $('vignette').classList.toggle('danger', !met && run.dayT < 15 && mode==='play');
  const qf = $('quotaFill');
  qf.style.width = clamp(100*run.dayEarned/q,0,100)+'%';
  const pace = (1 - run.dayT/run.dayLen) * q; // where you "should" be by now
  qf.className = met ? 'done' : (run.dayEarned < pace*0.75 && run.dayT < run.dayLen*0.7 ? 'behind' : '');
  $('quotaTxt').textContent = 'QUOTA '+run.dayEarned+' / '+q;
  if (met && !run.qMet) { run.qMet = true; banner('QUOTA MET','<span class="sub2">THE FARM ENDURES — KEEP HARVESTING</span>','#8effc1'); sfx.day(); }
  $('focusFill').style.width = clamp(100*run.focus/focusCap(),0,100)+'%';
  const k = (karma()+1)/2; // 0 blight .. 1 radiance
  const col = run.veilT>0 ? '#cfd2ff' : blend('#a86bff','#ffd75e',k);
  $('orb').style.background = 'radial-gradient(circle at 35% 35%, #fff8, transparent 60%), '+col;
  $('orb').style.boxShadow = '0 0 12px 3px '+col+'88';

  if (run.combo>=2) { cl.style.display='inline'; cl.textContent = '⚡×'+run.combo; }
  else cl.style.display='none';
}
function blend(c1,c2,t){
  const p = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
