<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aura Farm</title>
<style>
  :root {
    --gold:#ffd75e; --gold-deep:#e8a92c; --viol:#a86bff; --viol-deep:#6d35c9;
    --mint:#8effc1; --rose:#ff6b90; --ink:#0b0a14; --glass:rgba(20,16,40,.72);
    --glass-brt:rgba(34,27,66,.85); --line:rgba(255,255,255,.14); --txt:#efeaff;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--txt); }
  #cv { position:fixed; inset:0; touch-action:none; }
  button { font-family:inherit; color:inherit; }

  @keyframes pulseGlow { 0%,100%{ box-shadow:0 0 10px 2px var(--gc,rgba(255,215,94,.4)); } 50%{ box-shadow:0 0 22px 7px var(--gc,rgba(255,215,94,.65)); } }
  @keyframes urgent { 0%,100%{ background:rgba(120,20,40,.9); transform:scale(1);} 50%{ background:rgba(220,40,70,.95); transform:scale(1.07);} }
  @keyframes popIn { 0%{ opacity:0; transform:scale(.6) translateY(14px);} 60%{ transform:scale(1.06);} 100%{ opacity:1; transform:scale(1) translateY(0);} }
  @keyframes bannerIn { 0%{ opacity:0; transform:translateY(-18px) scale(.9); letter-spacing:8px;} 20%{ opacity:1;} 80%{ opacity:1; transform:none; letter-spacing:2px;} 100%{ opacity:0; transform:translateY(-6px);} }
  @keyframes shake { 0%,100%{ transform:none;} 20%{ transform:translate(-5px,2px);} 40%{ transform:translate(4px,-3px);} 60%{ transform:translate(-3px,-2px);} 80%{ transform:translate(3px,2px);} }
  @keyframes flashFade { 0%{ opacity:.55; } 100%{ opacity:0; } }
  @keyframes shineSweep { 0%{ transform:translateX(-120%) skewX(-18deg);} 100%{ transform:translateX(240%) skewX(-18deg);} }
  @keyframes barPulse { 0%,100%{ filter:brightness(1);} 50%{ filter:brightness(1.5);} }
  @keyframes floaty { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  @keyframes hueShift { 0%,100%{ filter:hue-rotate(0deg);} 50%{ filter:hue-rotate(24deg);} }
  .shaking { animation:shake .35s ease-out; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px; display:flex; flex-direction:column; gap:6px; pointer-events:none; z-index:5;
    background:linear-gradient(180deg, rgba(8,6,18,.85), rgba(8,6,18,0)); }
  #hudRow1 { display:flex; align-items:center; gap:7px; }
  .chip { padding:4px 10px; border-radius:10px; background:var(--glass); border:1px solid var(--line); font-size:12.5px; font-weight:800; letter-spacing:.4px; white-space:nowrap; backdrop-filter:blur(6px); }
  #dayLbl { color:#cfc6ee; }
  #timeLbl { font-variant-numeric:tabular-nums; color:#fff; }
  #timeLbl.urgent { animation:urgent .8s infinite; border-color:#ff5c7a; }
  #essenceLbl { margin-left:auto; color:var(--gold); border-color:rgba(255,215,94,.35); text-shadow:0 0 12px rgba(255,215,94,.5); }
  #comboLbl { color:var(--mint); font-weight:900; font-size:13px; text-shadow:0 0 10px rgba(142,255,193,.6); animation:floaty 1s infinite; }
  #hudRow2 { display:flex; align-items:center; gap:8px; }
  .bar { flex:1; height:20px; border-radius:10px; background:rgba(255,255,255,.09); overflow:hidden; position:relative; border:1px solid var(--line); }
  #quotaFill { height:100%; width:0%; background:linear-gradient(90deg,#3fb2ff,var(--mint)); border-radius:10px; transition:width .35s, background .35s; position:relative; overflow:hidden; }
  #quotaFill.behind { background:linear-gradient(90deg,#ff9d3f,#ff5c7a); animation:barPulse 1.1s infinite; }
  #quotaFill.done { background:linear-gradient(90deg,var(--gold-deep),var(--gold)); }
  #quotaFill::after { content:''; position:absolute; top:0; bottom:0; width:36%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); animation:shineSweep 2.4s infinite; }
  #quotaTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; letter-spacing:.5px; text-shadow:0 1px 3px #000a; font-variant-numeric:tabular-nums; }
  #focusWrap { display:flex; align-items:center; gap:6px; width:120px; }
  #focusBar { flex:1; height:9px; border-radius:5px; background:rgba(255,255,255,.1); overflow:hidden; border:1px solid var(--line); }
  #focusFill { height:100%; width:100%; background:linear-gradient(90deg,#c99bff,#7fb4ff); border-radius:5px; }
  #focusLbl { font-size:9.5px; font-weight:800; letter-spacing:1px; opacity:.65; }
  #orb { width:28px; height:28px; border-radius:50%; flex:none; background:radial-gradient(circle at 35% 35%, #fff8, transparent 60%), var(--gold); animation:pulseGlow 2.2s infinite; }

  #menuBtns { position:fixed; right:8px; top:calc(env(safe-area-inset-top,0px) + 66px); display:flex; flex-direction:column; gap:8px; z-index:6; }
  .mbtn { width:44px; height:44px; border-radius:13px; border:1px solid var(--line); background:var(--glass); color:#fff; font-size:20px; cursor:pointer; backdrop-filter:blur(6px); box-shadow:0 3px 10px rgba(0,0,0,.35); }
  .mbtn:active { transform:scale(.92); }
  #artBtns { position:fixed; left:8px; top:calc(env(safe-area-inset-top,0px) + 66px); display:flex; flex-direction:column; gap:8px; z-index:6; }
  .abtn { width:50px; height:50px; border-radius:15px; border:1px solid rgba(255,215,94,.35); background:var(--glass-brt); color:#fff; font-size:23px; cursor:pointer; position:relative; box-shadow:0 0 14px rgba(255,215,94,.22), 0 3px 10px rgba(0,0,0,.4); }
  .abtn:disabled { opacity:.4; box-shadow:none; }
  .abtn .cd { position:absolute; right:4px; bottom:2px; font-size:11px; font-weight:900; color:var(--gold); text-shadow:0 1px 2px #000; }

  /* ---------- overlays ---------- */
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:8; opacity:0; transition:opacity .6s;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(160,20,50,.55) 100%); }
  #vignette.danger { opacity:1; animation:barPulse 1s infinite; }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:9; opacity:0; }
  #flash.go { animation:flashFade .5s ease-out; }
  #banner { position:fixed; top:22%; left:0; right:0; text-align:center; z-index:16; pointer-events:none; display:none;
    font-size:30px; font-weight:900; letter-spacing:2px; text-shadow:0 0 24px rgba(255,215,94,.8), 0 3px 8px #000; }
  #banner.show { display:block; animation:bannerIn 1.7s ease-out forwards; }
  #banner .sub2 { display:block; font-size:13px; font-weight:700; letter-spacing:3px; opacity:.85; margin-top:4px; }
  #specCard { position:fixed; left:50%; top:34%; transform:translateX(-50%); z-index:17; pointer-events:none; display:none;
    background:var(--glass-brt); border:1.5px solid var(--sc,#c79bff); border-radius:18px; padding:14px 22px; text-align:center;
    box-shadow:0 0 30px var(--sc,#c79bff), 0 8px 30px rgba(0,0,0,.5); backdrop-filter:blur(8px); }
  #specCard.show { display:block; animation:popIn .4s cubic-bezier(.2,1.4,.4,1); }
  #specCard .ico { font-size:34px; display:block; }
  #specCard .tname { font-size:15px; font-weight:900; letter-spacing:2px; color:var(--sc,#c79bff); }
  #specCard .who { font-size:12.5px; opacity:.85; margin-top:2px; }

  /* ---------- NPC panel ---------- */
  #npcPanel { position:fixed; left:0; right:0; bottom:0; padding:34px 12px calc(env(safe-area-inset-bottom,0px) + 10px); z-index:5; display:none;
    background:linear-gradient(180deg, rgba(13,10,26,0), rgba(13,10,26,.94) 26%); }
  #npcHead { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  #npcName { font-weight:900; font-size:18px; letter-spacing:.3px; }
  #npcGroup { font-size:12px; opacity:.6; }
  #peakBadge { margin-left:auto; display:none; padding:4px 10px; border-radius:10px; font-size:12px; font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,#fff2c4,#ffd75e); color:#4a3400; animation:urgent .7s infinite; }
  #npcMood { font-size:13px; margin-bottom:7px; min-height:17px; color:#cfc6ee; line-height:1.45; }
  .meterRow { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .meterLabel { width:52px; font-size:9.5px; font-weight:900; letter-spacing:1.5px; opacity:.6; text-align:right; }
  .meter { flex:1; height:13px; border-radius:7px; position:relative; border:1px solid var(--line); overflow:hidden; }
  .meter.mood { background:linear-gradient(90deg, var(--viol-deep), #3a3357 48%, #3a3357 52%, var(--gold-deep)); }
  #moodMarker { position:absolute; top:-2px; bottom:-2px; width:5px; border-radius:3px; background:#fff; box-shadow:0 0 8px #fff; left:50%; transition:left .25s; }
  .meter.charge { background:rgba(255,255,255,.08); }
  #peakZone { position:absolute; top:0; bottom:0; left:75%; right:0; background:repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 5px, rgba(255,255,255,.05) 5px 10px); }
  #chargeFill { position:absolute; top:0; bottom:0; left:0; width:0%; background:linear-gradient(90deg,#6b5115,var(--gold)); transition:width .25s; }
  #chargeFill.neg { background:linear-gradient(90deg,#38205c,var(--viol)); }
  #chargeFill.peaking { animation:barPulse .5s infinite; }
  #chargeTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9.5px; font-weight:900; letter-spacing:1px; text-shadow:0 1px 2px #000; }
  #npcActions { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
  .act { padding:10px 12px; border-radius:13px; border:1px solid var(--line); font-size:13px; font-weight:800; color:#fff; background:#2a2347; cursor:pointer; position:relative; overflow:hidden; box-shadow:0 3px 8px rgba(0,0,0,.3); }
  .act:disabled { opacity:.35; box-shadow:none; }
  .act:active:not(:disabled) { transform:scale(.94); }
  .act.rad { background:linear-gradient(180deg,#95731f,#6b5115); border-color:rgba(255,215,94,.5); }
  .act.bli { background:linear-gradient(180deg,#53308a,#38205c); border-color:rgba(168,107,255,.5); }
  .act.harv { background:linear-gradient(180deg,#1f6b50,#154434); border-color:rgba(142,255,193,.55); }
  .act.harvB { background:linear-gradient(180deg,#6b1f47,#44152e); border-color:rgba(255,107,144,.55); }
  .act.ready { animation:pulseGlow 1s infinite; --gc:rgba(142,255,193,.5); }
  .act.harvB.ready { --gc:rgba(255,107,144,.5); }
  .cdveil { position:absolute; inset:0; background:rgba(0,0,0,.55); transform-origin:left; }
  .cost { font-size:10px; opacity:.75; font-weight:500; display:block; }

  /* ---------- modal ---------- */
  #modal { position:fixed; inset:0; background:rgba(5,4,12,.8); z-index:20; display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px); }
  #modal.center { align-items:center; }
  #modalContent { background:linear-gradient(180deg,#1c1638,#151027); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:520px; max-height:86vh; overflow-y:auto; padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 18px); box-shadow:0 -10px 40px rgba(0,0,0,.5); }
  #modal.center #modalContent { border-radius:20px; margin:12px; }
  h2 { font-size:20px; margin-bottom:4px; letter-spacing:.3px; }
  h3 { font-size:13px; margin:15px 0 7px; color:#bfb3e8; letter-spacing:1.2px; text-transform:uppercase; }
  .sub { font-size:13px; opacity:.72; margin-bottom:12px; line-height:1.45; }
  .big { display:block; width:100%; padding:14px; margin-top:10px; border-radius:14px; border:none; background:linear-gradient(180deg,#8a67ff,#5d40d6); color:#fff; font-size:15px; font-weight:900; letter-spacing:.4px; cursor:pointer; box-shadow:0 4px 16px rgba(124,92,255,.35); position:relative; overflow:hidden; }
  .big::after { content:''; position:absolute; top:0; bottom:0; width:30%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent); animation:shineSweep 3s infinite; }
  .big.ghost { background:transparent; border:1px solid rgba(255,255,255,.28); box-shadow:none; }
  .big.ghost::after { display:none; }
  .big:disabled { opacity:.4; }
  .shopItem { display:flex; align-items:center; gap:10px; padding:11px; border-radius:13px; background:rgba(255,255,255,.05); margin-bottom:8px; border:1px solid rgba(255,255,255,.06); }
  .shopItem .info { flex:1; }
  .shopItem .nm { font-weight:800; font-size:14px; }
  .shopItem .ds { font-size:12px; opacity:.7; line-height:1.35; }
  .buyBtn { padding:9px 13px; border-radius:11px; border:none; font-weight:900; font-size:13px; background:linear-gradient(180deg,#ffe28e,var(--gold-deep)); color:#3a2c00; cursor:pointer; white-space:nowrap; box-shadow:0 3px 10px rgba(255,215,94,.3); }
  .buyBtn:disabled { background:#443d5e; color:#999; box-shadow:none; }
  .owned { color:var(--mint); font-weight:800; font-size:13px; padding:8px 4px; }
  .caseGroup { margin-bottom:12px; }
  .caseRow { display:flex; gap:6px; flex-wrap:wrap; }
  .spec { width:64px; padding:7px 4px; border-radius:11px; background:rgba(255,255,255,.05); text-align:center; font-size:10px; }
  .spec .tier { font-size:16px; display:block; }
  .spec.empty { opacity:.32; }
  .setDone { color:var(--mint); font-size:11px; font-weight:800; }
  .venueCard { padding:13px; border-radius:14px; background:rgba(255,255,255,.06); margin-bottom:9px; border:1px solid transparent; cursor:pointer; }
  .venueCard.cur { border-color:#8a67ff; box-shadow:0 0 14px rgba(124,92,255,.25); }
  .venueCard.lock { opacity:.45; }
  .venueCard .nm { font-weight:900; font-size:15px; }
  .venueCard .ds { font-size:12px; opacity:.7; margin-top:2px; line-height:1.35; }
  .statline { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  .tag { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:800; margin-left:6px; }
  .tag.bloom { background:#1d5c46; color:var(--mint); }
  .tag.blight { background:#4c2b7a; color:#d9b8ff; }
  .tag.turb { background:#5c4a1d; color:#ffe08e; }

  /* ---------- toasts ---------- */
  #toasts { position:fixed; top:calc(env(safe-area-inset-top,0px) + 74px); left:0; right:0; display:flex; flex-direction:column; align-items:center; gap:6px; z-index:15; pointer-events:none; }
  .toast { background:var(--glass-brt); border:1px solid var(--line); padding:8px 15px; border-radius:13px; font-size:13px; font-weight:700; animation:popIn .3s ease-out; max-width:86vw; text-align:center; backdrop-filter:blur(6px); box-shadow:0 4px 14px rgba(0,0,0,.4); }

  .titleWrap { text-align:center; padding:12px 0 6px; }
  .titleWrap h1 { font-size:38px; letter-spacing:2px; background:linear-gradient(90deg,var(--gold),#ff9d6b,var(--viol)); -webkit-background-clip:text; background-clip:text; color:transparent; animation:hueShift 6s infinite; }
  .titleWrap .tg { font-size:13px; opacity:.7; margin-top:5px; letter-spacing:1px; }
  .howto p { font-size:13.5px; line-height:1.55; margin-bottom:9px; color:#d8d0f0; }
  .gold { color:var(--gold); font-weight:800; } .viol { color:#c79bff; font-weight:800; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" style="display:none">
  <div id="hudRow1">
    <div id="orb"></div>
    <span class="chip" id="dayLbl">DAY 1</span>
    <span class="chip" id="timeLbl">2:00</span>
    <span id="comboLbl" style="display:none"></span>
    <span class="chip" id="essenceLbl">✦ 0</span>
  </div>
  <div id="hudRow2">
    <div class="bar"><div id="quotaFill"></div><span id="quotaTxt">QUOTA 0 / 90</span></div>
    <div id="focusWrap"><span id="focusLbl">FOCUS</span><div id="focusBar"><div id="focusFill"></div></div></div>
  </div>
</div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="banner"></div>
<div id="specCard"></div>

<div id="menuBtns" style="display:none">
  <button class="mbtn" onclick="openShop()">🛍️</button>
  <button class="mbtn" onclick="openCase()">📦</button>
  <button class="mbtn" onclick="openMap()">🗺️</button>
  <button class="mbtn" id="sndBtn" onclick="toggleSound()">🔊</button>
  <button class="mbtn" onclick="openSettings()">⏸️</button>
</div>
<div id="artBtns" style="display:none"></div>

<div id="npcPanel">
  <div id="npcHead"><span id="npcName"></span><span id="npcGroup"></span><span id="peakBadge"></span></div>
  <div id="npcMood"></div>
  <div class="meterRow"><span class="meterLabel">MOOD</span><div class="meter mood"><div id="moodMarker"></div></div></div>
  <div class="meterRow"><span class="meterLabel">CHARGE</span><div class="meter charge"><div id="peakZone"></div><div id="chargeFill"></div><span id="chargeTxt"></span></div></div>
  <div id="npcActions"></div>
</div>

<div id="toasts"></div>
<div id="modal"><div id="modalContent"></div></div>

<script>
'use strict';
/* =========================================================
   AURA FARM — harvest emotional energy. Radiance vs Blight.
   ========================================================= */

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const rnd = (a,b)=>a+Math.random()*(b-a);
const $ = id=>document.getElementById(id);

/* ---------------- static data ---------------- */
const DAY_LEN = 120;
const LAST_DAY = 12;
const quotaFor = d => 90 + 55*(d-1);

const TIERS = [
  { min:0.92, name:'Transcendent', icon:'💎', color:'#9ef3ff' },
  { min:0.75, name:'Brilliant',    icon:'🌟', color:'#ffd75e' },
  { min:0.55, name:'Vivid',        icon:'✨', color:'#c79bff' },
  { min:0.35, name:'Common',       icon:'🔸', color:'#d8d0f0' },
  { min:0.00, name:'Faint',        icon:'·',  color:'#8a84a0' },
];
const tierOf = i => TIERS.find(t=>i>=t.min);

const VENUES = [
  { id:'park',   name:'Dawnlight Park',    desc:'Calm, sunny, forgiving. Emotions drift gently upward.',      ambient: 0.06, volMult:0.85, bloomAt:500,  sky:['#1b2a4a','#3a2f5c'], ground:'#16321f' },
  { id:'club',   name:'The Neon Cellar',   desc:'Loud and volatile. Feelings spike fast in every direction.', ambient: 0.00, volMult:1.55, bloomAt:900,  sky:['#180a2e','#3d0f4f'], ground:'#1a0f2e' },
  { id:'office', name:'Grindstone Offices',desc:'Fluorescent stress. Moods lean sour — rich soil for Blight.',ambient:-0.08, volMult:1.10, bloomAt:1300, sky:['#101622','#232c3d'], ground:'#1c2230' },
  { id:'market', name:'The Night Market',  desc:'Lanterns and haggling. The mood swings like a pendulum all day.', ambient:0, volMult:1.25, bloomAt:1700, sky:['#0d0d26','#2e1240'], ground:'#241536' },
];
const venueById = id => VENUES.find(v=>v.id===id);

/* Fixed rosters: id, name, group, baseline valence, volatility, resilience */
const ROSTER = [
  // Dawnlight Park (10)
  { id:'p1', name:'Miles',  venue:'park', group:'The Joggers',      base: 0.35, vol:0.9, res:1.2 },
  { id:'p2', name:'Dot',    venue:'park', group:'The Joggers',      base: 0.15, vol:1.2, res:1.0 },
  { id:'p3', name:'Ferris', venue:'park', group:'The Joggers',      base:-0.10, vol:1.4, res:0.8 },
  { id:'p4', name:'June',   venue:'park', group:'The Picnickers',   base: 0.45, vol:0.7, res:1.4 },
  { id:'p5', name:'Olly',   venue:'park', group:'The Picnickers',   base: 0.10, vol:1.1, res:1.0 },
  { id:'p6', name:'Petra',  venue:'park', group:'The Picnickers',   base:-0.20, vol:1.3, res:0.9 },
  { id:'p7', name:'Sam',    venue:'park', group:'The Picnickers',   base: 0.25, vol:0.8, res:1.1 },
  { id:'p8', name:'Quill',  venue:'park', group:'The Birdwatchers', base: 0.05, vol:0.6, res:1.3 },
  { id:'p9', name:'Nan',    venue:'park', group:'The Birdwatchers', base: 0.30, vol:0.9, res:1.2 },
  { id:'p10',name:'Theo',   venue:'park', group:'The Birdwatchers', base:-0.15, vol:1.0, res:0.9 },
  // The Neon Cellar (14)
  { id:'c1', name:'Vex',    venue:'club', group:'The House Regulars', base: 0.30, vol:1.5, res:1.0 },
  { id:'c2', name:'Lola',   venue:'club', group:'The House Regulars', base: 0.20, vol:1.6, res:0.9 },
  { id:'c3', name:'Bram',   venue:'club', group:'The House Regulars', base:-0.05, vol:1.3, res:1.1 },
  { id:'c4', name:'Kiki',   venue:'club', group:'The House Regulars', base: 0.40, vol:1.4, res:1.2 },
  { id:'c5', name:'Wren',   venue:'club', group:'The Wallflowers',    base:-0.30, vol:0.8, res:0.8 },
  { id:'c6', name:'Moss',   venue:'club', group:'The Wallflowers',    base:-0.15, vol:0.7, res:1.0 },
  { id:'c7', name:'Ivy',    venue:'club', group:'The Wallflowers',    base: 0.00, vol:0.9, res:1.1 },

/* ---------------- audio ---------------- */
let AC = null, masterG = null;
function ac(){
  if (!AC) { try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterG = AC.createGain(); masterG.gain.value = meta.muted?0:1; masterG.connect(AC.destination);
  } catch(e) {} }
  return AC;
}
function beep(freq, dur, type, vol, when){
  const c = ac(); if (!c) return;
  const t = c.currentTime + (when||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol||0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(masterG); o.start(t); o.stop(t+dur+0.02);
}
/* quiet ambient pad per venue */
let padNodes = null;
const PAD_CHORDS = { park:[220,329.6], club:[146.8,220.0], office:[164.8,246.9], market:[196.0,293.7] };
function startAmbient(venueId){
  const c = ac(); if (!c) return;
  stopAmbient();
  const freqs = PAD_CHORDS[venueId]||PAD_CHORDS.park;
  const g = c.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.016, c.currentTime+2);
  const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 700;
  g.connect(f); f.connect(masterG);
  const oscs = freqs.map((fr,i)=>{
    const o = c.createOscillator(); o.type = i? 'triangle':'sine';
    o.frequency.value = fr; o.detune.value = i?4:-3; o.connect(g); o.start(); return o;
  });
  padNodes = { g, f, oscs };
}
function stopAmbient(){
  if (!padNodes) return;
  try { const c = AC; padNodes.g.gain.linearRampToValueAtTime(0, c.currentTime+0.6);
    const p = padNodes; setTimeout(()=>p.oscs.forEach(o=>{ try{o.stop();}catch(e){} }), 800);
  } catch(e) {}
  padNodes = null;
}

function placeNPCs(){
  const groups = {}; let gi = 0;
  for (const g of GROUPS) groups[g] = ANCHORS[(gi++) % ANCHORS.length];
  for (const d of ROSTER) {
    const n = run.npcs[d.id];
    if (!(n.placed && n.x)) {
      const a = groups[d.group];
      n.x = a[0]*W + rnd(-70,70); n.y = playTop() + a[1]*(playBot()-playTop()) + rnd(-50,50);
      n.tx = n.x; n.ty = n.y; n.placed = true;
    }
    n.x = clamp(n.x, 40, W-64); n.y = clamp(n.y, playTop()+30, playBot()-10);
    n.tx = clamp(n.tx, 40, W-64); n.ty = clamp(n.ty, playTop()+30, playBot()-10);
  }
}
function groupAnchor(g){ const gi = GROUPS.indexOf(g); return ANCHORS[gi % ANCHORS.length]; }

/* ---------------- helpers ---------------- */
function karma(){ const t = run.rad + run.bli; return t<1 ? 0 : (run.rad - run.bli)/t; }
function setBonus(){
  let done = 0;
  for (const g of GROUPS) if (groupMembers(g).every(m=>meta.case[m.id])) done++;
  return 1 + done*0.05;
}
function setsDone(){ return GROUPS.filter(g=>groupMembers(g).every(m=>meta.case[m.id])).length; }
function yieldMult(sign, zone){
  let m = setBonus();
  if (run.upgrades.reson) m *= 1.15;
  const z = run.zones[zone];
  if (z.bloomed==='blight' && sign<0) m *= 1.25;
  if (z.bloomed==='turb') m *= 1.10;
  return m;
}
function repMod(dir){
  if (run.veilT > 0) return 1;
  const k = karma();
  if (k > 0.4) return dir>0 ? 1.1 : 0.75;
  if (k < -0.4) return dir<0 ? 1.1 : 0.75;
  return 1;
}
function trackSeen(id, amt){
  const n = run.npcs[id]; n.seen += amt;
  if (!meta.known[id] && n.seen >= 4 && (NPC_TRAITS[id]||[]).length) {
    meta.known[id] = 1; saveMeta();
    toast('🔍 You’ve read '+npcDef(id).name+': '+NPC_TRAITS[id].map(t=>TRAITS[t].n).join(' + '));
    if (selected===id) renderPanel();
  }
}
function traitLine(id){
  const ts = NPC_TRAITS[id]||[];
  if (!ts.length) return '';
  return known(id) ? ts.map(t=>TRAITS[t].n+' — '+TRAITS[t].d).join(' · ') : '❔ unread (interact to learn them)';
}
function moodText(n){
  if (n.state==='husk') return 'Hollow. Nothing left to feel.';
  if (n.state==='recover') return 'Glowing softly, spent — recovering ('+Math.ceil(n.recoverT)+'s).';
  const v = n.v, i = n.i;
  let m;
  if (v > 0.5)      m = i>0.7?'Euphoric':i>0.4?'Delighted':'Content';
  else if (v > 0.15) m = i>0.7?'Excited':i>0.4?'Upbeat':'Pleasant';
  else if (v > -0.15)m = i>0.6?'Restless':'Neutral';
  else if (v > -0.5) m = i>0.7?'Seething':i>0.4?'Gloomy':'Irritable';
  else               m = i>0.7?'Despairing':i>0.4?'Miserable':'Down';
  if (n.peak<=0 && i>0.6) m += ' — aura swelling…';
  return m;
}
function updateMeters(n){
  $('moodMarker').style.left = ((clamp(n.v,-1,1)+1)/2*100)+'%';
  const cf = $('chargeFill');
  cf.style.width = Math.round(n.i*100)+'%';
  cf.classList.toggle('neg', n.v<0);
  cf.classList.toggle('peaking', n.peak>0);
  $('chargeTxt').textContent = n.state==='husk' ? 'DRAINED' : Math.round(n.i*100)+'%';
  const pb = $('peakBadge');
  if (n.peak>0 && n.state==='idle'){ pb.style.display='inline-block'; pb.textContent = '⚡ PEAK '+Math.ceil(n.peak)+'s'; }
  else pb.style.display='none';
}

/* ---------------- actions ---------------- */
function actUsable(actId, n){
  const a = ACTIONS[actId];
  const stateOk = a.special==='tend' ? n.state==='recover' : n.state==='idle';
  return stateOk && run.focus >= a.cost && (cooldowns[actId]||0) <= 0;
}
function doAction(actId){
  if (!run || mode!=='play' || modalOpen) return;
  const act = ACTIONS[actId]; const n = selected && run.npcs[selected];
  if (!act || !n || !actUsable(actId, n)) return;
  run.focus -= act.cost; cooldowns[actId] = act.cd;

  if (act.special==='tend') {
    n.recoverT *= 0.5; sfx.act(1); puff(n.x, n.y, '#8effc1', 8);
    return renderPanel();
  }
  if (act.special==='fester') {
    n.festerT = 20; sfx.act(-1); puff(n.x, n.y, '#a86bff', 8); return renderPanel();
  }

  const def = npcDef(selected);
  const targets = act.aoe ? groupMembers(def.group).map(m=>run.npcs[m.id]).filter(t=>t.state==='idle') : [n];
  for (const t of targets) pushEmotion(t, act, npcDef(ROSTER.find(r=>run.npcs[r.id]===t).id));
  sfx.act(act.dir);
  trackSeen(selected, 1);
  renderPanel();
}
function pushEmotion(n, act, def){
  let mod = repMod(act.dir);
  if (act.dir>0 && hasTrait(def.id,'sunny')) mod *= 1.5;
  if (act.dir<0 && hasTrait(def.id,'spirally')) mod *= 1.5;
  if (hasTrait(def.id,'guarded')) mod *= 0.7;
  n.v = clamp(n.v + act.dir*act.power*(1-Math.abs(n.v)*0.4)*mod, -1, 1);
  if (n.lastDir === act.dir) n.momentum = Math.min(2, n.momentum + 0.25);
  else { n.momentum = 1; n.i *= 0.85; }
  n.lastDir = act.dir;
  const cap = Math.min(1, (act.dir>0 ? 0.95 : 1.0) + (hasTrait(def.id,'bottled')?0.05:0));
  const volm = def.vol * venueById(def.venue).volMult * (run.zones[def.venue].bloomed==='turb'?1.5:1);
  n.i = clamp(n.i + act.gain*n.momentum*volm*mod, 0, cap);
  puff(n.x, n.y-20, act.dir>0?'#ffd75e':'#a86bff', 5);
}

function harvest(){
  if (!run || mode!=='play' || modalOpen) return;
  const n = selected && run.npcs[selected]; if (!n || n.state!=='idle') return;
  if (run.focus < 10) return;
  const def = npcDef(selected);
  const sign = n.v >= 0 ? 1 : -1;
  if (Math.abs(n.v) < 0.25) { toast('Their feeling is too faint to harvest. Push it further.'); return; }
  run.focus -= 10;
  trackSeen(selected, 2);

  const onPeak = n.peak > 0;
  if (onPeak) run.combo = (run.combo>0 && run.lastSign!==sign) ? 1 : run.combo+1;
  else run.combo = 0;
  run.lastSign = sign;
  const comboMult = 1 + Math.min(0.4, Math.max(0, run.combo-1)*0.08);

  let amt = Math.round(n.i * 100 * (sign<0 ? 1.6 : 1.0) * yieldMult(sign, def.venue) * comboMult);
  if (hasTrait(def.id,'deepwell')) amt = Math.round(amt*1.2);
  run.essence += amt; run.dayEarned += amt; run.harvests++;
  if (sign>0) { run.rad += amt; run.dayRad += amt; } else { run.bli += amt; run.dayBli += amt; }
  if (!run.dayBest || n.i > run.dayBest.i) run.dayBest = { name:def.name, i:+n.i.toFixed(3) };
  if (run.combo>=2) floatText(n.x, n.y-56, 'COMBO ×'+run.combo, '#8effc1');
  const z = run.zones[def.venue]; z.total += amt; if (sign>0) z.rad += amt; else z.bli += amt;

  // specimen
  const t = tierOf(n.i);
  const prev = meta.case[def.id];
  if (!prev || n.i > prev.i) {
    const setsBefore = setsDone();
    meta.case[def.id] = { i:+n.i.toFixed(3), tier:t.name, type:sign>0?'radiance':'blight' };
    saveMeta();
    showSpecCard(t, def, Math.round(n.i*100), !!prev);
    if (setsDone() > setsBefore) { banner('SET COMPLETE','<span class="sub2">'+def.group.toUpperCase()+' — +5% ALL YIELDS, FOREVER</span>','#8effc1'); sfx.buy(); }
  }

  burst(n.x, n.y, sign>0?'#ffd75e':'#c79bff', Math.round(10+n.i*22));
  floatText(n.x, n.y-34, '+'+amt+' ✦', sign>0?'#ffd75e':'#c79bff');
  if (sign>0) { sfx.harvR(); flashFx('rgba(255,215,94,.4)');
    n.state='recover'; n.recoverT = 28/def.res * (hasTrait(def.id,'resilient')?0.5:1); n.i = 0; n.v *= 0.5; n.peak = 0; }
  else { sfx.harvB(); flashFx('rgba(110,30,170,.5)'); shakeFx();
    n.state='husk'; n.i = 0; n.peak = 0; toast(def.name+' goes quiet. They won’t feel again this run.'); }

  checkBloom(def.venue);
  renderPanel(); updateHud();
}

function checkBloom(vid){
  const z = run.zones[vid], vd = venueById(vid);
  if (z.bloomed || z.total < vd.bloomAt) return;
  const rr = z.rad / Math.max(1, z.total);
  z.bloomed = rr >= 0.6 ? 'bloom' : (rr <= 0.4 ? 'blight' : 'turb');
  const label = z.bloomed==='bloom' ? '🌸 BLOOMS WITH LIGHT' : z.bloomed==='blight' ? '🥀 CURDLES INTO BLIGHT' : '🌪 TURNS TURBULENT';
  banner(vd.name.toUpperCase(), '<span class="sub2">'+label+'</span>', z.bloomed==='bloom'?'#8effc1':z.bloomed==='blight'?'#d9b8ff':'#ffe08e');
  sfx.peak();
  const idx = VENUES.findIndex(v=>v.id===vid);
  if (idx+1 < VENUES.length && !run.unlocked[VENUES[idx+1].id]) {
    run.unlocked[VENUES[idx+1].id] = true;
    toast('🗺️ New venue unlocked: '+VENUES[idx+1].name);
  }
}

/* ---------------- simulation ---------------- */
function update(dt){
  if (mode!=='play' || modalOpen) return;
  run.focus = clamp(run.focus + 6*dt, 0, 100);
  for (const k in cooldowns) cooldowns[k] = Math.max(0, cooldowns[k]-dt);
  run.veilT = Math.max(0, run.veilT - dt);
  for (const k in run.artCd) run.artCd[k] = Math.max(0, run.artCd[k]-dt);
  artsT -= dt; if (artsT<=0){ artsT = 0.3; updateArtBtns(); }

  // dusk dread: heartbeat when the quota is short and the light is dying
  tensionT -= dt;
  if (tensionT<=0){ tensionT = 1;
    if (run.dayEarned < quotaFor(run.day) && run.dayT < 15) sfx.heartbeat(); }
  // peak window closing on the selected soul: audible ticking
  if (selected){ const sn = run.npcs[selected];
    if (sn && sn.peak>0 && sn.peak<3){ tickT -= dt; if (tickT<=0){ tickT = 0.5; sfx.tick(); } } }

  run.dayT -= dt;
  if (run.dayT <= 0) return endDay();

  const cur = run.venue;
  const huskList = [];
  for (const d of ROSTER) { const n = run.npcs[d.id];
    if (n.state==='husk' && d.venue===cur) huskList.push({ x:n.x, y:n.y, r:hasTrait(d.id,'fragile')?220:110 }); }

  for (const d of ROSTER) {
    const n = run.npcs[d.id];
    const inCur = d.venue === cur;
    if (n.state==='recover') {
      n.recoverT -= dt * (inCur?1:0.6);
      n.v += (d.base+0.2 - n.v)*0.03*dt;
      if (n.recoverT <= 0) { n.state='idle'; n.i = 0.05; n.momentum = 1; }
      continue;
    }
    if (n.state==='husk') { if (inCur) wander(n, d, dt, 0.35); continue; }
    if (!inCur) { n.v += (d.base - n.v)*0.01*dt; n.i = Math.max(0.05, n.i - 0.004*dt); continue; }

    const vd = venueById(d.venue), z = run.zones[d.venue];
    // drift toward baseline + ambiance + daily weather (the market's mood swings like a pendulum)
    const driftMult = n.festerT>0 ? 0.25 : 1;
    const amb = vd.ambient + (vd.id==='market' ? 0.15*Math.sin((DAY_LEN-run.dayT)/12) : 0);
    let target = d.base + amb + (WX().drift||0) + (z.bloomed==='bloom'?0.12:0) + (z.bloomed==='blight'?-0.12:0);
    n.v += (clamp(target,-1,1) - n.v)*0.018*dt*driftMult;
    if (n.festerT>0) n.festerT -= dt;

    // life events: spontaneous emotional weather — observation matters
    n.eventT -= dt * d.vol * vd.volMult * (WX().events||1) * (hasTrait(d.id,'volatile')?2:1);
    if (n.eventT <= 0) {
      n.eventT = rnd(9, 26);
      n.v = clamp(n.v + rnd(-0.5,0.5)*d.vol, -1, 1);
      n.i = clamp(n.i + rnd(0.08,0.3)*d.vol, 0, 1);
      puff(n.x, n.y-18, n.v>=0?'#ffe9a8':'#d0b0ff', 3);
    }

    // group contagion (Loners are immune; Empaths catch it double)
    if (!hasTrait(d.id,'loner')) {
      let gs = 0, gc = 0;
      for (const m of groupMembers(d.group)) { if (m.id===d.id) continue;
        const o = run.npcs[m.id]; if (o.state!=='idle') continue;
        gs += o.v; gc++; }
      if (gc) n.v += (gs/gc - n.v) * 0.03 * dt * (z.bloomed==='blight'?2:1) * (hasTrait(d.id,'empath')?2:1);
    }

    // husk gloom (paused while the Umbral Veil holds)
    if (run.veilT<=0) for (const h of huskList) { const dx=h.x-n.x, dy=h.y-n.y;
      if (dx*dx+dy*dy < h.r*h.r) n.v = clamp(n.v - 0.012*dt, -1, 1); }

    // intensity decay
    if (n.peak <= 0) n.i = Math.max(0.04, n.i - 0.008*dt*(WX().decay||1)*(hasTrait(d.id,'steady')?0.5:1));

    // ripening: peak windows
    if (n.peak > 0) {
      n.peak -= dt;
      const cap = Math.min(1, (n.v>=0 ? 0.95 : 1.0) + (hasTrait(d.id,'bottled')?0.05:0));
      n.i = clamp(n.i + 0.02*dt*d.vol, 0, cap);
      if (n.peak <= 0) { // missed it — the feeling vents
        n.i = 0.18; if (n.v < 0) n.v *= 0.4;
        puff(n.x, n.y-20, '#888', 6);
        if (selected===d.id) renderPanel();
      }
    } else if (n.i >= 0.75) {
      n.peakDur = Math.max(2.5, ((n.v>=0 ? 12 : 5) - (hasTrait(d.id,'bottled')?1.5:0)) * (run.upgrades.patient?1.5:1));
      n.peak = n.peakDur;
      sfx.peak(); puff(n.x, n.y-26, '#fff', 10);
      if (selected===d.id) renderPanel();
    }

    wander(n, d, dt, 1);
  }

  // keep people from standing inside each other
  const curNpcs = ROSTER.filter(d=>d.venue===cur).map(d=>run.npcs[d.id]);
  for (let a=0; a<curNpcs.length; a++) for (let b=a+1; b<curNpcs.length; b++) {
    const A = curNpcs[a], B = curNpcs[b];
    const dx = B.x-A.x, dy = B.y-A.y, dist = Math.hypot(dx,dy) || 0.01;
    if (dist < 42) {
      const push = (42-dist) * 0.5 * Math.min(1, dt*6);
      const ux = dx/dist, uy = dy/dist;
      A.x = clamp(A.x - ux*push, 36, W-64); A.y = clamp(A.y - uy*push, playTop()+28, playBot()-8);
      B.x = clamp(B.x + ux*push, 36, W-64); B.y = clamp(B.y + uy*push, playTop()+28, playBot()-8);
    }
  }

  // occasional panel refresh so mood text stays honest
  panelT -= dt; if (panelT<=0){ panelT = 0.5; if (selected) renderPanel(true); }
  updateHud();
}
let panelT = 0, tensionT = 0, tickT = 0;

function wander(n, d, dt, speedMult){
  n.moveT -= dt;
  if (n.moveT <= 0) {
    n.moveT = rnd(2.5, 7);
    const a = groupAnchor(d.group);
    const ax = a[0]*W, ay = playTop() + a[1]*(playBot()-playTop());
    n.tx = clamp(ax + rnd(-85,85), 36, W-64);
    n.ty = clamp(ay + rnd(-65,65), playTop()+28, playBot()-8);
  }
  const dx = n.tx-n.x, dy = n.ty-n.y, dist = Math.hypot(dx,dy);
  if (dist > 2) { const sp = 16*speedMult; n.x += dx/dist*sp*dt; n.y += dy/dist*sp*dt; }
}

/* ---------------- day / run flow ---------------- */
function endDay(){
  const met = run.dayEarned >= quotaFor(run.day);
  if (!met) { sfx.fail(); return gameOver(); }
  sfx.day();
  run.history.push({ d:run.day, rad:run.dayRad, bli:run.dayBli });
  if (run.day >= LAST_DAY) return ending();
  const husks = ROSTER.filter(d=>run.npcs[d.id].state==='husk').length;
  showModal(`
    <h2>Dusk falls on Day ${run.day}</h2>
    <div class="sub">Quota met. The farm endures.</div>
    <div class="statline"><span>Harvested today</span><b>✦ ${run.dayEarned}</b></div>
    <div class="statline"><span>Quota</span><b>✦ ${quotaFor(run.day)}</b></div>
    ${run.dayBest?`<div class="statline"><span>Finest capture</span><b>${run.dayBest.name} · ${Math.round(run.dayBest.i*100)}%</b></div>`:''}
    <div class="statline"><span>Husks left behind</span><b>${husks}</b></div>
    <div class="statline"><span>Tomorrow’s quota</span><b>✦ ${quotaFor(run.day+1)}</b></div>
    <div class="statline"><span>Balance</span><b style="color:#ffd75e">✦ ${run.essence}</b></div>
    <button class="big" onclick="nextDay()">Begin Day ${run.day+1} ➜</button>
  `, true, true);
}
function nextDay(){
  run.day++; run.dayT = DAY_LEN; run.dayEarned = 0; run.focus = 100;
  run.dayRad = 0; run.dayBli = 0; run.dayBest = null; run.combo = 0; run.qMet = false;
  banner('DAY '+run.day, '<span class="sub2">QUOTA ✦'+quotaFor(run.day)+' BEFORE DUSK</span>');
  for (const d of ROSTER) { const n = run.npcs[d.id];
    if (n.state==='recover') { n.recoverT = Math.max(0, n.recoverT - 20); if (n.recoverT<=0){ n.state='idle'; n.i=0.05; } } }
  rollDay();
  saveRun(); saveMeta(); closeModal();
  announceDay();
}
function gameOver(){
  mode = 'over';
  const p = Math.round(100 * run.rad / Math.max(1, run.rad+run.bli));
  showModal(`
    <h2>The Farm Withers</h2>
    <div class="sub">Day ${run.day} ended at ✦${run.dayEarned} of the ✦${quotaFor(run.day)} quota. The aura wells run dry.</div>
    <div class="statline"><span>Days survived</span><b>${run.day}</b></div>
    <div class="statline"><span>Total harvested</span><b>✦ ${run.rad+run.bli}</b></div>
    <div class="statline"><span>Radiance purity</span><b>${p}%</b></div>
    <div class="statline"><span>Specimens kept</span><b>${Object.keys(meta.case).length} / ${ROSTER.length}</b></div>
    <div class="sub" style="margin-top:10px">Your specimen case survives. Every set bonus carries into the next run.</div>
    <button class="big" onclick="restart()">Farm Again</button>
    <button class="big ghost" onclick="toTitle()">Title</button>
  `, true);
  run = null; saveRun(); stopAmbient();
}
function ending(){
  mode = 'ending';
  const total = run.rad + run.bli;
  const p = run.rad / Math.max(1,total);
  const pct = Math.round(p*100);
  let title, line;
  if (p >= 0.85) { title = '🌞 The Luminary'; line = 'You farmed light and left every field brighter than you found it. The auras will feed you forever.'; }
  else if (p <= 0.15) { title = '🥀 The Reaper of Vibes'; line = 'You drank deep and left husks in your wake. A magnificent, terrible harvest — and a silent farm.'; }
  else { title = '⚖️ The Gray Broker'; line = 'Light when it paid, blight when it didn’t. The farm neither blooms nor dies. It waits.'; }
  const specs = Object.values(meta.case);
  const avgI = specs.length ? specs.reduce((s,x)=>s+x.i,0)/specs.length : 0;
  const grade = specs.length>=38&&avgI>=0.8?'S':specs.length>=28&&avgI>=0.65?'A':specs.length>=18&&avgI>=0.5?'B':'C';
  if (!meta.endings.includes(title)) meta.endings.push(title);
  meta.bestPurity = pct; saveMeta();
  const husks = ROSTER.filter(d=>run.npcs[d.id].state==='husk').length;
  const bars = run.history.map(h=>{ const t2 = h.rad+h.bli || 1; const rp = Math.round(100*h.rad/t2);
    return `<div style="display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px"><span style="width:30px;opacity:.6">D${h.d}</span><div style="flex:1;height:8px;border-radius:4px;overflow:hidden;display:flex;background:rgba(255,255,255,.08)"><div style="width:${rp}%;background:#ffd75e"></div><div style="flex:1;background:#a86bff"></div></div></div>`;
  }).join('');
  showModal(`
    <h2>${title}</h2>
    <div class="sub">${line}</div>
    <div class="statline"><span>Radiance purity</span><b>${pct}%</b></div>
    <div class="statline"><span>Lifetime harvest</span><b>✦ ${total}</b></div>
    <div class="statline"><span>Souls husked</span><b>${husks}</b></div>
    <div class="statline"><span>Specimen case</span><b>${specs.length}/${ROSTER.length} · avg ${(avgI*100)|0}% · grade ${grade}</b></div>
    <div class="statline"><span>Sets completed</span><b>${setsDone()} / ${GROUPS.length}</b></div>
    <h3>How each day was farmed</h3>${bars}
    <button class="big" onclick="restart()">Farm Again</button>
    <button class="big ghost" onclick="toTitle()">Title</button>
  `, true);
  run = null; saveRun(); stopAmbient();
}
function restart(){ closeModal(); startGame(true); }
function toTitle(){ closeModal(); titleScreen(); }

/* ---------------- UI: hud, panel, toasts, particles ---------------- */
function updateHud(){
  if (!run) return;
  $('dayLbl').textContent = 'DAY '+run.day;
  const s = Math.max(0, Math.ceil(run.dayT));
  const tl = $('timeLbl');
  tl.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('essenceLbl').textContent = '✦ '+run.essence;
  const q = quotaFor(run.day);
  const met = run.dayEarned >= q;
  tl.classList.toggle('urgent', !met && run.dayT < 20 && mode==='play');
  $('vignette').classList.toggle('danger', !met && run.dayT < 15 && mode==='play');
  const qf = $('quotaFill');
  qf.style.width = clamp(100*run.dayEarned/q,0,100)+'%';
  const pace = (1 - run.dayT/DAY_LEN) * q; // where you "should" be by now
  qf.className = met ? 'done' : (run.dayEarned < pace*0.75 && run.dayT < DAY_LEN*0.7 ? 'behind' : '');
  $('quotaTxt').textContent = 'QUOTA '+run.dayEarned+' / '+q;
  if (met && !run.qMet) { run.qMet = true; banner('QUOTA MET','<span class="sub2">THE FARM ENDURES — KEEP HARVESTING</span>','#8effc1'); sfx.day(); }
  $('focusFill').style.width = run.focus+'%';
  const k = (karma()+1)/2; // 0 blight .. 1 radiance
  const col = run.veilT>0 ? '#cfd2ff' : blend('#a86bff','#ffd75e',k);
  $('orb').style.background = 'radial-gradient(circle at 35% 35%, #fff8, transparent 60%), '+col;
  $('orb').style.boxShadow = '0 0 12px 3px '+col+'88';
  const cl = $('comboLbl');
  if (run.combo>=2) { cl.style.display='inline'; cl.textContent = '⚡×'+run.combo; }
  else cl.style.display='none';
}
function blend(c1,c2,t){
  const p = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  return 'rgb('+a.map((x,i)=>Math.round(lerp(x,b[i],t))).join(',')+')';
}

function renderPanel(soft){
  const panel = $('npcPanel');
  if (!selected || !run) { panel.style.display='none'; return; }
  const d = npcDef(selected), n = run.npcs[selected];
  if (d.venue !== run.venue) { selected=null; panel.style.display='none'; return; }
  panel.style.display = 'block';
  $('npcName').textContent = d.name;
  $('npcGroup').textContent = d.group;
  $('npcMood').innerHTML = moodText(n) + '<br><span style="opacity:.62;font-size:11.5px">'+traitLine(d.id)+'</span>';
  updateMeters(n);
  if (soft) { // just refresh disabled states + mood
    for (const btn of $('npcActions').querySelectorAll('.act[data-a]')) {
      const a = ACTIONS[btn.dataset.a];
      btn.disabled = !actUsable(btn.dataset.a, n);
      const veil = btn.querySelector('.cdveil');
      if (veil) veil.style.transform = 'scaleX('+clamp((cooldowns[btn.dataset.a]||0)/a.cd,0,1)+')';
    }
    const hb = $('npcActions').querySelector('.act[data-h]');
    if (hb) refreshHarvestBtn(hb, n);
    return;
  }
  const box = $('npcActions'); box.innerHTML = '';
  for (const id in ACTIONS) {
    if (!run.owned[id]) continue;
    const a = ACTIONS[id];
    const b = document.createElement('button');
    b.className = 'act '+a.cls; b.dataset.a = id;
    b.innerHTML = a.name+'<span class="cost">'+a.cost+' focus'+(a.aoe?' · group':'')+'</span><div class="cdveil" style="transform:scaleX(0)"></div>';
    b.onclick = ()=>doAction(id);
    b.disabled = !actUsable(id, n);
    box.appendChild(b);
  }
  const hb = document.createElement('button');
  hb.dataset.h = '1'; hb.onclick = harvest;
  refreshHarvestBtn(hb, n);
  box.appendChild(hb);
}
function refreshHarvestBtn(hb, n){
  const sign = n.v>=0?1:-1;
  const ready = n.state==='idle' && Math.abs(n.v)>=0.25 && run.focus>=10;
  hb.className = 'act '+(sign>0?'harv':'harvB')+(ready && n.peak>0 ? ' ready':'');
  const t = tierOf(n.i);
  hb.innerHTML = (sign>0?'Harvest ✦ Radiance':'Drain ✦ Blight')
    +'<span class="cost">'+t.icon+' '+t.name+' · ~'+Math.round(n.i*100*(sign<0?1.6:1)*yieldMult(sign, npcDef(selected).venue))+'✦ · '+(sign>0?'they recover':'PERMANENT')+'</span>';
  hb.disabled = !ready;
}

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  $('toasts').appendChild(t);
  while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
  setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; setTimeout(()=>t.remove(), 420); }, 3400);
}
function banner(main, subHtml, color){
  const b = $('banner');
  b.innerHTML = main + (subHtml||'');
  b.style.color = color || '#fff';
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function flashFx(color){
  const f = $('flash'); f.style.background = color;
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function shakeFx(){
  const c = $('cv'); c.classList.remove('shaking'); void c.offsetWidth; c.classList.add('shaking');
}
function showSpecCard(t, def, pct, upgraded){
  const c = $('specCard');
  c.style.setProperty('--sc', t.color);
  c.innerHTML = '<span class="ico">'+t.icon+'</span><div class="tname">'+t.name.toUpperCase()+' SPECIMEN</div><div class="who">'+def.name+' · '+pct+'%'+(upgraded?' · UPGRADED':'')+'</div>';
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
  clearTimeout(showSpecCard._t); showSpecCard._t = setTimeout(()=>c.classList.remove('show'), 1700);
}

function puff(x,y,color,n){ for(let i=0;i<n;i++) particles.push({x,y,vx:rnd(-30,30),vy:rnd(-60,-10),life:rnd(.4,.9),t:0,color,r:rnd(1.5,3.5)}); }
function burst(x,y,color,n){ for(let i=0;i<n;i++){ const a=rnd(0,6.283),sp=rnd(40,140); particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:rnd(.5,1.1),t:0,color,r:rnd(2,4.5)}); } }
function floatText(x,y,txt,color){ particles.push({x,y,vx:0,vy:-34,life:1.3,t:0,color,txt}); }

/* ---------------- modal screens ---------------- */
let stickyModal = false;
function showModal(html, center, sticky){
  modalOpen = true; stickyModal = !!sticky;
  $('modal').style.display = 'flex';
  $('modal').className = center ? 'center' : '';
  $('modalContent').innerHTML = html;
}
function closeModal(){ modalOpen = false; stickyModal = false; $('modal').style.display = 'none'; }
$('modal').addEventListener('click', e=>{ if (e.target.id==='modal' && mode==='play' && !stickyModal) closeModal(); });

function openShop(){
  if (mode!=='play') return; sfx.tap();
  let rows = '';
  for (const it of SHOP) {
    const owned = it.kind==='action' ? run.owned[it.id] : it.kind==='art' ? run.arts[it.id] : run.upgrades[it.id];
    rows += `<div class="shopItem"><div class="info"><div class="nm">${it.name}</div><div class="ds">${it.desc}</div></div>`
      + (owned ? '<div class="owned">owned</div>'
               : `<button class="buyBtn" ${run.essence<it.price?'disabled':''} onclick="buyItem('${it.id}')">✦ ${it.price}</button>`)
      + '</div>';
  }
  showModal(`<h2>Techniques</h2><div class="sub">Balance: <b style="color:#ffd75e">✦ ${run.essence}</b> — spending doesn’t affect quota progress.</div>${rows}<button class="big ghost" onclick="closeModal()">Close</button>`);
}
function buyItem(id){
  const it = SHOP.find(s=>s.id===id);
  if (!it || run.essence < it.price) return;
  run.essence -= it.price;
  if (it.kind==='action') run.owned[id] = true;
  else if (it.kind==='art') { run.arts[id] = true; renderArts(); }
  else run.upgrades[id] = true;
  sfx.buy(); saveRun(); openShop(); renderPanel(); updateHud();
}

/* ---------------- active arts ---------------- */
let artsT = 0;
const ART_DEFS = { chorus:{ icon:'🌟', cd:45 }, veil:{ icon:'🌑', cd:60 } };
function renderArts(){
  const box = $('artBtns'); box.innerHTML = '';
  const owned = run ? Object.keys(ART_DEFS).filter(a=>run.arts[a]) : [];
  box.style.display = owned.length ? 'flex' : 'none';
  for (const a of owned) {
    const b = document.createElement('button');
    b.className = 'abtn'; b.dataset.art = a;
    b.innerHTML = ART_DEFS[a].icon + '<span class="cd"></span>';
    b.onclick = ()=>useArt(a);
    box.appendChild(b);
  }
  updateArtBtns();
}
function updateArtBtns(){
  if (!run) return;
  for (const b of $('artBtns').querySelectorAll('.abtn')) {
    const cd = run.artCd[b.dataset.art]||0;
    b.disabled = cd>0 || run.focus<25 || mode!=='play';
    b.querySelector('.cd').textContent = cd>0 ? Math.ceil(cd) : '';
  }
}
function useArt(id){
  if (!run || mode!=='play' || modalOpen || !run.arts[id]) return;
  if ((run.artCd[id]||0) > 0 || run.focus < 25) return;
  run.focus -= 25; run.artCd[id] = ART_DEFS[id].cd;
  if (id==='chorus') {
    for (const d of ROSTER) { if (d.venue!==run.venue) continue;
      const n = run.npcs[d.id]; if (n.state!=='idle') continue;
      n.v = clamp(n.v + 0.25, -1, 1); n.i = clamp(n.i + 0.06, 0, 1);
      puff(n.x, n.y-16, '#ffe9a8', 4); }
    sfx.harvR(); toast('🌟 Radiant Chorus lifts the whole room.');
  } else {
    run.veilT = 12; sfx.act(-1); toast('🌑 Umbral Veil — your aura is unreadable for 12s.');
  }
  updateArtBtns(); renderPanel();
}

function openSettings(){
  if (mode!=='play') return; sfx.tap();
  showModal(`<h2>Paused</h2>
    <button class="big" onclick="closeModal()">Resume</button>
    <button class="big ghost" onclick="howTo()">How to Farm</button>
    <button class="big ghost" onclick="abandonRun()">Abandon Run</button>
    <div class="sub" style="margin-top:10px">The specimen case and everything you’ve learned about people are kept forever, run or no run.</div>`);
}
function abandonRun(){ run = null; saveRun(); stopAmbient(); closeModal(); titleScreen(); }

function openCase(){
  if (mode!=='play') return; sfx.tap();
  let html = '';
  for (const v of VENUES) {
    html += `<h3>${v.name}</h3>`;
    for (const g of GROUPS) {
      const mem = groupMembers(g).filter(m=>m.venue===v.id);

      const done = mem.every(m=>meta.case[m.id]);
      html += `<div class="caseGroup"><div style="font-size:12px;margin-bottom:4px">${g} ${done?'<span class="setDone">SET ✓ +5%</span>':''}</div><div class="caseRow">`;
      for (const m of mem) {
        const s = meta.case[m.id];
        html += s
          ? `<div class="spec" style="border:1px solid ${tierOf(s.i).color}55"><span class="tier">${tierOf(s.i).icon}</span>${m.name}<br><span style="color:${tierOf(s.i).color}">${Math.round(s.i*100)}%</span></div>`
          : `<div class="spec empty"><span class="tier">?</span>${m.name}<br>&nbsp;</div>`;
      }
      html += '</div></div>';
    }
  }
  showModal(`<h2>Specimen Case</h2><div class="sub">${Object.keys(meta.case).length}/${ROSTER.length} peak auras · re-capture at higher charge to upgrade. Kept forever.</div>${html}<button class="big ghost" onclick="closeModal()">Close</button>`);
}

function openMap(){
  if (mode!=='play') return; sfx.tap();
  let html = '';
  for (const v of VENUES) {
    const un = run.unlocked[v.id], z = run.zones[v.id];
    const tag = z.bloomed==='bloom'?'<span class="tag bloom">BLOOMING</span>':z.bloomed==='blight'?'<span class="tag blight">BLIGHTED</span>':z.bloomed==='turb'?'<span class="tag turb">TURBULENT</span>':'';
    html += `<div class="venueCard ${run.venue===v.id?'cur':''} ${un?'':'lock'}" ${un?`onclick="goVenue('${v.id}')"`:''}>
      <div class="nm">${v.name} ${tag}</div><div class="ds">${un ? v.desc + (z.bloomed?'':' · bloom at ✦'+v.bloomAt+' ('+z.total+')') : '🔒 Push a previous venue to its bloom threshold to unlock.'}</div></div>`;
  }
  showModal(`<h2>Venues</h2><div class="sub">Each venue keeps its own emotional weather — and remembers how you farmed it.</div>${html}<button class="big ghost" onclick="closeModal()">Close</button>`);
}
function goVenue(id){
  if (!run.unlocked[id]) return;
  run.venue = id; selected = null; renderPanel(); closeModal(); sfx.tap();
  startAmbient(id);
  toast('➜ '+venueById(id).name);
}

function howTo(back){
  showModal(`<h2>How to Farm</h2><div class="howto">
  <p>People give off <b>aura</b> — emotional energy. You harvest it. Meet the daily quota by dusk or the farm withers.</p>
  <p><span class="gold">Radiance</span>: lift someone up, harvest their joy. Slower — but they <b>recover</b> and can be farmed again.</p>
  <p><span class="viol">Blight</span>: grind someone down, drain their misery. Pays 1.6× and spikes higher — but it’s <b>permanent</b>. They become a husk, and husks spread gloom to everyone nearby.</p>
  <p><b>Timing is the skill.</b> An aura ring pulses faster as feeling builds. At high charge a <b>⚡ peak window</b> opens — harvest inside it for the best specimens. Too early: a weak specimen forever. Too late: the feeling vents to nothing. Blight peaks are short and sharp; Radiance peaks are wide and repeatable.</p>
  <p><b>The Specimen Case</b> keeps one peak aura per person — across every run. Complete a whole social group for a permanent +5% set bonus. Re-capture to upgrade.</p>
  <p>Your own aura shows what you are. Lean hard one way and the world responds — your opposite touch weakens.</p>
  <p><b>People have patterns.</b> Interact with someone enough and you’ll read their traits — Sunny, Spirally, Guarded, Deep Well… — and what you learn is kept forever. Each day brings <b>emotional weather</b> and sometimes a venue event worth chasing. Chain harvests inside peak windows of the same type for a <b>⚡ combo</b> — switching sides breaks it.</p>
  </div><button class="big" onclick="${back==='title'?'titleScreen()':'closeModal()'}">Got it</button>`, true);
  meta.seenHow = true; saveMeta();
}

function titleScreen(){
  mode = 'title'; run = null; selected = null; stopAmbient();
  $('hud').style.display='none'; $('menuBtns').style.display='none'; $('npcPanel').style.display='none';
  const hasSave = !!loadRun();
  const specs = Object.keys(meta.case).length;
  showModal(`<div class="titleWrap"><h1>AURA FARM</h1><div class="tg">harvest feelings · choose what you become</div></div>
    ${specs?`<div class="sub" style="text-align:center">📦 ${specs}/${ROSTER.length} specimens kept · ${setsDone()} sets${meta.bestPurity!==null?' · last purity '+meta.bestPurity+'%':''}</div>`:''}
    ${hasSave?'<button class="big" onclick="startGame(false)">Continue Run</button>':''}
    <button class="big ${hasSave?'ghost':''}" onclick="confirmNew()">New Run</button>
    <button class="big ghost" onclick="howTo('title')">How to Farm</button>`, true);
}
function confirmNew(){
  if (loadRun()) {
    showModal(`<h2>Start over?</h2><div class="sub">Your current run (mid-farm) will be abandoned. The specimen case is safe either way.</div>
      <button class="big" onclick="startGame(true)">Abandon &amp; Start Fresh</button>
      <button class="big ghost" onclick="titleScreen()">Back</button>`, true);
  } else if (!meta.seenHow) { howToThenStart(); }
  else startGame(true);
}
function howToThenStart(){
  showModal(`<h2>How to Farm</h2><div class="howto">
  <p>Tap a person. <span class="gold">Hype them up</span> or <span class="viol">put them down</span> to build their emotional charge, then <b>harvest</b> it as essence. Meet the quota before the 2-minute day ends.</p>
  <p><span class="gold">Radiance</span> is renewable. <span class="viol">Blight</span> pays more but husks the person permanently. Watch the ring: harvest inside the <b>⚡ peak window</b> for the finest specimens.</p>
  </div><button class="big" onclick="startGame(true)">Start Farming</button>`, true);
  meta.seenHow = true; saveMeta();
}

/* ---------------- input ---------------- */
cv.addEventListener('pointerdown', e=>{
  if (mode!=='play' || modalOpen || !run) return;
  ac(); // wake audio on gesture
  const x = e.clientX, y = e.clientY;
  let best = null, bd = 44*44;
  for (const d of ROSTER) {
    if (d.venue!==run.venue) continue;
    const n = run.npcs[d.id];
    const dx = n.x-x, dy = n.y-y, dist = dx*dx+dy*dy;
    if (dist < bd) { bd = dist; best = d.id; }
  }
  if (best) { selected = best; sfx.tap(); renderPanel(); }
  else { selected = null; renderPanel(); }
});

/* ---------------- rendering ---------------- */
function draw(){
  ctx.clearRect(0,0,W,H);
  if (!run || (mode!=='play' && mode!=='over' && mode!=='ending')) { drawBgTitle(); return; }
  const vd = venueById(run.venue), z = run.zones[run.venue];
  drawVenue(vd, z);
  const t = performance.now()/1000;
  for (const d of ROSTER) {
    if (d.venue!==run.venue) continue;
    drawNPC(d, run.npcs[d.id], t);
  }
  drawParticles();
}
function drawBgTitle(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141028'); g.addColorStop(1,'#0b0a14');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const t = performance.now()/1000;
  for (let i=0;i<24;i++){
    const x = (i*97.3)%W, y = (i*173.7 + t*12*(1+(i%3)))%H;
    ctx.globalAlpha = 0.25+0.2*Math.sin(t+i);
    ctx.fillStyle = i%2 ? '#ffd75e' : '#a86bff';
    ctx.beginPath(); ctx.arc(x, H-y, 2.2, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawVenue(vd, z){
  const g = ctx.createLinearGradient(0,0,0,H);
  let s0 = vd.sky[0], s1 = vd.sky[1];
  g.addColorStop(0,s0); g.addColorStop(1,s1);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if (z.bloomed==='bloom') { ctx.fillStyle='rgba(140,255,190,0.06)'; ctx.fillRect(0,0,W,H); }
  if (z.bloomed==='blight'){ ctx.fillStyle='rgba(90,30,140,0.14)'; ctx.fillRect(0,0,W,H); }
  // ground
  ctx.fillStyle = vd.ground;
  ctx.beginPath(); ctx.ellipse(W/2, playBot()+140, W*0.75, 220, 0, 0, 6.283); ctx.fill();
  // simple set dressing
  ctx.globalAlpha = 0.5;
  if (vd.id==='park') {
    for (const [fx,fy,r] of [[0.12,0.22,26],[0.88,0.2,32],[0.5,0.14,22]]) {
      ctx.fillStyle='#274a2c'; ctx.beginPath(); ctx.arc(fx*W, playTop()+fy*(playBot()-playTop()), r, 0, 6.283); ctx.fill();
      ctx.fillStyle='#3a2b1c'; ctx.fillRect(fx*W-3, playTop()+fy*(playBot()-playTop())+r-6, 6, 22);
    }
  } else if (vd.id==='club') {
    const t = performance.now()/1000;
    for (let i=0;i<4;i++){
      ctx.fillStyle = ['#ff2f9255','#2fdcff55','#c02fff55','#ffe32f55'][i];
      const bx = W*(0.2+0.2*i) + Math.sin(t*0.7+i)*30;
      ctx.beginPath(); ctx.moveTo(bx,0); ctx.lineTo(bx-46, playBot()); ctx.lineTo(bx+46, playBot()); ctx.closePath(); ctx.fill();
    }
  } else if (vd.id==='office') {
    ctx.fillStyle='#2c3448';
    for (let i=0;i<3;i++) ctx.fillRect(W*0.14 + i*W*0.28, playTop()+30, W*0.16, 26);
    ctx.fillStyle='#e8ecf455';
    for (let i=0;i<5;i++) ctx.fillRect(W*0.1+i*W*0.18, 70, W*0.08, 5);
  } else { // night market lantern strings
    const t = performance.now()/1000;
    const cols = ['#ffb84e','#ff6b81','#7fe08e','#6bb8ff'];
    for (let row=0; row<2; row++) for (let i=0; i<7; i++) {
      const x = W*(0.08+0.14*i), y = playTop()+26+row*44 + Math.sin(i*1.3+row+t*0.6)*6;
      ctx.fillStyle = cols[(i+row)%4];
      ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(x,y,6.5,0,6.283); ctx.fill();
      ctx.globalAlpha = 0.16; ctx.beginPath(); ctx.arc(x,y,13,0,6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // daylight fades to dusk as the quota clock runs down
  const dp = 1 - run.dayT/DAY_LEN;
  ctx.fillStyle = 'rgba(255,140,60,'+(0.10*Math.sin(Math.PI*dp)).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(4,2,12,'+(0.38*Math.pow(dp,1.5)).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
}
function drawNPC(d, n, t){
  const husked = n.state==='husk', rec = n.state==='recover';
  const y = n.y + Math.sin(t*1.7 + n.bob)*2.5;
  // aura ring
  if (!husked) {
    const pulse = 1 + 0.5*Math.sin(t * (2 + n.i*9));
    const rr = 24 + n.i*13 + pulse*2.5;
    const col = n.v >= 0 ? '255,215,94' : '168,107,255';
    const alpha = rec ? 0.10 : 0.14 + n.i*0.4;
    const grad = ctx.createRadialGradient(n.x, y, 6, n.x, y, rr);
    grad.addColorStop(0, 'rgba('+col+','+alpha+')');
    grad.addColorStop(1, 'rgba('+col+',0)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(n.x, y, rr, 0, 6.283); ctx.fill();
    if (n.peak > 0) { // peak sparkle ring
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.5+0.4*Math.sin(t*12))+')';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(n.x, y, rr+3, 0, 6.283*(n.peak/n.peakDur)); ctx.stroke();
    }
    // always-on charge ring: fills clockwise as emotional charge builds
    const cr = 21;
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.beginPath(); ctx.arc(n.x, y-2, cr, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = n.peak>0 && Math.sin(t*14)>0 ? '#fff' : (n.v>=0 ? '#ffd75e' : '#a86bff');
    ctx.beginPath(); ctx.arc(n.x, y-2, cr, -1.5708, -1.5708 + 6.283*Math.min(1,n.i)); ctx.stroke();
    ctx.lineCap = 'butt';
    if (n.peak > 0 && n.state==='idle') { // the moment to strike
      ctx.fillStyle = '#fff'; ctx.font = '900 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('⚡', n.x, y-30 - 2.5*Math.sin(t*10));
    }
  }
  // body
  const gi = GROUPS.indexOf(d.group);
  const bodyCols = ['#4e79d4','#d46a4e','#57b06a','#b05aa8','#c2a13c','#5aa8b0','#8a6ad4','#b0685a','#6ab058','#a85a78'];
  ctx.fillStyle = husked ? '#4a4756' : bodyCols[gi % bodyCols.length];
  ctx.beginPath(); ctx.ellipse(n.x, y+6, 13, 16, 0, 0, 6.283); ctx.fill();
  // head
  ctx.fillStyle = husked ? '#5c5968' : '#f0d3b8';
  ctx.beginPath(); ctx.arc(n.x, y-12, 10, 0, 6.283); ctx.fill();
  // face
  ctx.fillStyle = husked ? '#39364a' : '#2b2340';
  ctx.beginPath(); ctx.arc(n.x-3.5, y-13, husked?2.2:1.6, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(n.x+3.5, y-13, husked?2.2:1.6, 0, 6.283); ctx.fill();
  if (!husked) { // mouth curve by valence
    ctx.strokeStyle = '#2b2340'; ctx.lineWidth = 1.4; ctx.beginPath();
    const m = n.v*3.5;
    ctx.moveTo(n.x-4, y-8); ctx.quadraticCurveTo(n.x, y-8+m, n.x+4, y-8); ctx.stroke();
  } else { ctx.strokeStyle='#39364a'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(n.x-3,y-8); ctx.lineTo(n.x+3,y-8); ctx.stroke(); }
  // selected marker
  if (selected===d.id) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(n.x, y, 28, t%6.283, t%6.283+6.283); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#fff'; ctx.font='700 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.name, n.x, y-42);
  }
  if ((run.upgrades.sight || hasTrait(d.id,'openbook')) && !husked) {
    ctx.fillStyle = n.peak>0?'#fff':'#cfc6ee'; ctx.font='700 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText(Math.round(n.i*100)+'%', n.x, y+30);
  }
  if (rec) { ctx.fillStyle='#8effc1'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('💤 '+Math.ceil(n.recoverT), n.x, y+30); }
}
function drawParticles(){
  for (let i=particles.length-1; i>=0; i--) {
    const p = particles[i]; p.t += dtGlobal;
    if (p.t >= p.life) { particles.splice(i,1); continue; }
    const a = 1 - p.t/p.life;
    p.x += p.vx*dtGlobal; p.y += p.vy*dtGlobal; p.vy += 40*dtGlobal;
    if (p.txt) {
      ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.font = '800 16px sans-serif'; ctx.textAlign='center';
      ctx.fillText(p.txt, p.x, p.y);
    } else {
      ctx.globalAlpha = a*0.9; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now(), dtGlobal = 0.016;
function frame(now){
  dtGlobal = clamp((now-last)/1000, 0.001, 0.05);
  last = now;
  update(dtGlobal);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', ()=>{ if (document.hidden) { saveRun(); saveMeta(); } });
window.addEventListener('pagehide', ()=>{ saveRun(); saveMeta(); });

titleScreen();
</script>
